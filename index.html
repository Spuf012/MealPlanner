<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
    --line: #e4e2dd; --accent: #2f7d4f; --accent-soft: #e3f1e8; --danger: #c0392b;
    --chip: #efede8; --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --card: #22242a; --text: #f2f2f2; --muted: #9a9ca3;
      --line: #33363d; --accent: #5cc08a; --accent-soft: #1f3a2b; --danger: #ff6b5b;
      --chip: #2c2f36;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom)); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 12px 16px 24px; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0 14px; }
  header.top h1 { font-size: 28px; margin: 0; letter-spacing: -0.02em; }
  .iconbtn { border: 0; background: var(--chip); border-radius: 999px; min-width: 40px; height: 40px; padding: 0 12px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; }
  .iconbtn.primary { background: var(--accent); color: #fff; }
  .weeknav { display: flex; align-items: center; justify-content: space-between; background: var(--card);
    border-radius: var(--radius); padding: 6px; margin-bottom: 14px; border: 1px solid var(--line); }
  .weeknav button { border: 0; background: transparent; width: 44px; height: 40px; border-radius: 10px; font-size: 20px; }
  .weeknav button:active { background: var(--chip); }
  .weeknav .label { text-align: center; }
  .weeknav .label b { display: block; }
  .weeknav .label span { font-size: 13px; color: var(--muted); }
  .day { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
  .day.today { border-color: var(--accent); }
  .day h3 { margin: 0; padding: 10px 14px 4px; font-size: 14px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .day.today h3 { color: var(--accent); }
  .slot { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; text-align: left;
    padding: 10px 14px; border-top: 1px solid var(--line); }
  .slot:first-of-type { border-top: 0; }
  .slot:active { background: var(--chip); }
  .slot .when { width: 56px; flex: none; font-size: 13px; color: var(--muted); }
  .slot .what { flex: 1; font-weight: 500; }
  .slot .what.empty { color: var(--muted); font-weight: 400; }
  .slot .what.note { font-style: italic; }
  .slot .cat { font-size: 12px; color: var(--muted); }
  .search { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); margin-bottom: 10px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; scrollbar-width: none; }
  .chip { flex: none; border: 0; background: var(--chip); padding: 6px 12px; border-radius: 999px; font-size: 14px; }
  .chip.on { background: var(--accent); color: #fff; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); width: 100%;
    border-left: 0; border-right: 0; border-bottom: 0; background: transparent; text-align: left; }
  .row:first-child { border-top: 0; }
  .row:active { background: var(--chip); }
  .row .main { flex: 1; min-width: 0; }
  .row .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.done .main { opacity: .45; text-decoration: line-through; }
  .check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--muted); flex: none; display: grid; place-items: center; }
  .row:not(.done):not(.spice) .check, .row.spice.on .check { border-color: var(--accent); background: var(--accent); }
  .row:not(.done):not(.spice) .check::after, .row.spice.on .check::after { content: "✓"; color: #fff; font-size: 14px; font-weight: 700; }
  .catchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .catlabel { font-size: 12px; color: var(--muted); margin: 10px 4px 5px; }
  .catgroup:first-child .catlabel { margin-top: 0; }
  .cbx { display: flex; align-items: center; gap: 10px; margin: 16px 4px 4px; font-weight: 500; }
  .cbx input { width: 22px; height: 22px; accent-color: var(--accent); }
  .empty-state { text-align: center; color: var(--muted); padding: 40px 20px; }
  .hint { font-size: 13px; color: var(--muted); margin: 8px 4px 14px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
  .btn { border: 0; border-radius: 12px; padding: 13px 14px; font-weight: 600; background: var(--chip); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.danger { background: transparent; color: var(--danger); }
  .btn.full { grid-column: 1 / -1; width: 100%; }
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); z-index: 10; }
  nav.tabs button { flex: 1; max-width: 160px; border: 0; background: transparent; padding: 6px 0; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; }
  nav.tabs button svg { width: 26px; height: 26px; }
  nav.tabs button.on { color: var(--accent); }
  dialog { border: 0; padding: 0; width: min(560px, 100%); max-width: 100%; max-height: 92vh; background: var(--bg); color: var(--text);
    border-radius: 18px 18px 0 0; margin: auto auto 0; }
  @media (min-width: 700px) { dialog { border-radius: 18px; margin: auto; } }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .sheet { display: flex; flex-direction: column; max-height: 92vh; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .sheet-head b { font-size: 17px; }
  .sheet-head button { border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 4px; }
  .sheet-body { overflow-y: auto; padding: 14px 16px calc(20px + env(safe-area-inset-bottom)); }
  label.f { display: block; font-size: 13px; color: var(--muted); margin: 12px 4px 6px; }
  .in { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
  .ing { display: grid; grid-template-columns: 62px 74px 1fr 40px 28px; gap: 5px; margin-bottom: 6px; align-items: center; }
  .ing .opt { border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 8px; height: 38px; font-size: 12px; font-weight: 600; padding: 0; }
  .ing .opt.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .leftover { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 1px 7px; border-radius: 999px; margin-right: 4px; vertical-align: 1px; }
  .leftover-sugg { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; border: 1px dashed var(--accent); background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; }
  .leftover-sugg > span:first-child { font-size: 24px; }
  .leftover-toggle { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 14px; margin-top: 16px; }
  .leftover-toggle .sw { flex: none; width: 44px; height: 26px; border-radius: 999px; background: var(--chip); position: relative; transition: background .15s; }
  .leftover-toggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: left .15s; }
  .leftover-toggle.on { border-color: var(--accent); }
  .leftover-toggle.on .sw { background: var(--accent); }
  .leftover-toggle.on .sw::after { left: 21px; }
  .seg { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .plus { color: var(--muted); font-weight: 400; }
  .dishblock { padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
  .dishhead { display: flex; align-items: center; gap: 8px; }
  .dishhead h2 { margin: 4px 4px 2px; flex: 1; font-size: 22px; }
  .dishhead .rm { border: 0; background: var(--chip); border-radius: 50%; width: 30px; height: 30px; font-size: 18px; color: var(--muted); }
  details summary { cursor: pointer; color: var(--accent); font-weight: 600; margin: 10px 4px 4px; }
  .inglist { margin: 0 4px; padding-left: 20px; }
  .inglist li { margin: 3px 0; }
  textarea.in { resize: vertical; font: inherit; }
  .opt-tag { font-size: 12px; color: var(--accent); font-weight: 600; }
  .ing .in { padding: 10px 8px; }
  .ing [data-act=delingr] { border: 0; background: transparent; color: var(--danger); font-size: 20px; padding: 0; }
  .group-title { font-size: 13px; color: var(--muted); margin: 16px 4px 6px; text-transform: uppercase; letter-spacing: .04em; }
  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0;
    transition: opacity .2s; pointer-events: none; z-index: 50; }
  .toast.show { opacity: 1; }
  .login { max-width: 380px; margin: 12vh auto 0; padding: 0 20px; }
  .login h1 { font-size: 30px; margin-bottom: 4px; }
  .banner { background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
  .addrow { display: flex; gap: 8px; margin-top: 12px; }
  .addrow .in { flex: 1; }
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs" hidden>
  <button data-tab="woche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Woche</button>
  <button data-tab="gerichte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 13h16a8 8 0 0 1-16 0zM12 5v3M8 6l1 2M16 6l-1 2"/></svg>Gerichte</button>
  <button data-tab="einkauf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20.5" r="1"/><circle cx="17" cy="20.5" r="1"/></svg>Einkauf</button>
</nav>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script type="module">
// ─────────────────────────────────────────────────────────────
// KONFIGURATION – nach dem Anlegen des Supabase-Projekts ausfüllen.
// Leer lassen = lokaler Testmodus (Daten nur auf diesem Gerät).
const CONFIG = {
  SUPABASE_URL: 'https://geurcsvzxfqrzirobngz.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_joz98vTnth83tg8Ux-65Sw_LiD8q46J',
};
// ─────────────────────────────────────────────────────────────

const SLOTS = [['mittag', 'Mittag'], ['abend', 'Abend']];
const UNITS = ['', 'g', 'kg', 'ml', 'l', 'Stk', 'EL', 'TL', 'Prise', 'Pck', 'Dose', 'Bund', 'Zehe', 'Scheibe'];
const CAT_GROUPS = [
  ['Hauptzutat', ['Fleisch', 'Geflügel', 'Fisch', 'Vegetarisch', 'Vegan']],
  ['Art', ['Pasta', 'Pizza', 'OnePot', 'Suppe', 'Eintopf', 'Auflauf', 'Ofengericht', 'Salat', 'Reis', 'Kartoffeln', 'Grillen', 'Soße', 'Beilagen', 'Snack', 'Brot/Abendbrot', 'Frühstück', 'Süßes/Dessert']],
  ['Küche', ['Deutsch', 'Italienisch', 'Chinesisch', 'Asiatisch', 'Mexikanisch', 'Indisch', 'Griechisch', 'Türkisch']],
  ['Praktisch', ['Schnell', 'Meal-Prep', 'Kinder-Liebling', 'Gäste']],
];
const DEFAULT_CATS = CAT_GROUPS.flatMap(g => g[1]);
const DAYNAMES = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// ── Datum-Helfer ─────────────────────────────────────────────
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay() + 6) % 7; return addDays(x, -wd); };
const weekNo = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); };
const fmtShort = d => d.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });

// ── Datenschicht ─────────────────────────────────────────────
const LocalStore = {
  mode: 'local',
  async init() { return true; },
  async session() { return true; },
  async dishes() { return ls.get('ep.dishes', []); },
  async saveDish(d) { const all = ls.get('ep.dishes', []); const i = all.findIndex(x => x.id === d.id);
    if (i >= 0) all[i] = d; else all.push(d); ls.set('ep.dishes', all); return d; },
  async deleteDish(id) { ls.set('ep.dishes', ls.get('ep.dishes', []).filter(x => x.id !== id));
    const p = ls.get('ep.plan', {}); for (const k in p) if (p[k].dish_id === id) delete p[k]; ls.set('ep.plan', p); },
  async plan(from, to) { const p = ls.get('ep.plan', {}); return Object.values(p).filter(e => e.day >= from && e.day <= to); },
  async setSlot(day, slot, dish_id, note, leftover = false, extra_ids = [], extra_texts = []) { const p = ls.get('ep.plan', {}); const k = day + '|' + slot;
    if (!dish_id && !note) delete p[k]; else p[k] = { day, slot, dish_id: dish_id || null, note: note || '', leftover: !!(dish_id && leftover), extra_ids: dish_id ? extra_ids : [], extra_texts: dish_id ? extra_texts : [] }; ls.set('ep.plan', p); },
  async catalog() { return Object.values(ls.get('ep.catalog', {})); },
  async saveCatalog(entries) { const c = ls.get('ep.catalog', {}); for (const e of entries) c[e.kind + '|' + e.name_key] = e; ls.set('ep.catalog', c); },
  async saveDishes(arr) { const all = ls.get('ep.dishes', []); const m = new Map(all.map(d => [d.id, d])); for (const d of arr) m.set(d.id, d); ls.set('ep.dishes', [...m.values()]); },
  async savePlan(arr) { const p = ls.get('ep.plan', {}); for (const e of arr) p[e.day + '|' + e.slot] = e; ls.set('ep.plan', p); },
  async deleteAll() { for (const k of ['ep.dishes', 'ep.plan', 'ep.catalog']) localStorage.removeItem(k); },
};

const SupaStore = {
  mode: 'cloud', sb: null,
  async init() {
    if (this.sb) return;
    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
    // Nur "https://xyz.supabase.co" verwenden – Pfade/Schrägstriche am Ende entfernen
    const url = new URL(CONFIG.SUPABASE_URL.trim()).origin;
    this.sb = createClient(url, CONFIG.SUPABASE_ANON_KEY.trim(), { auth: { persistSession: true, autoRefreshToken: true } });
  },
  async session() { const { data } = await this.sb.auth.getSession(); return !!data.session; },
  async login(email, password) { const { error } = await this.sb.auth.signInWithPassword({ email, password }); if (error) throw error; },
  async logout() { await this.sb.auth.signOut(); },
  async dishes() { const { data, error } = await this.sb.from('dishes').select('*').order('name'); if (error) throw error; return data; },
  async saveDish(d) { const { error } = await this.sb.from('dishes').upsert(d); if (error) throw error; return d; },
  async deleteDish(id) { const { error } = await this.sb.from('dishes').delete().eq('id', id); if (error) throw error; },
  async plan(from, to) { const { data, error } = await this.sb.from('plan').select('*').gte('day', from).lte('day', to); if (error) throw error; return data; },
  async setSlot(day, slot, dish_id, note, leftover = false, extra_ids = [], extra_texts = []) {
    const q = (!dish_id && !note)
      ? this.sb.from('plan').delete().eq('day', day).eq('slot', slot)
      : this.sb.from('plan').upsert({ day, slot, dish_id: dish_id || null, note: note || '', leftover: !!(dish_id && leftover), extra_ids: dish_id ? extra_ids : [], extra_texts: dish_id ? extra_texts : [] });
    const { error } = await q; if (error) throw error;
  },
  async catalog() { const { data, error } = await this.sb.from('catalog').select('*'); if (error) throw error; return data; },
  async saveCatalog(entries) { if (!entries.length) return; const { error } = await this.sb.from('catalog').upsert(entries); if (error) throw error; },
  async saveDishes(arr) { for (let i = 0; i < arr.length; i += 200) { const { error } = await this.sb.from('dishes').upsert(arr.slice(i, i + 200)); if (error) throw error; } },
  async savePlan(arr) { for (let i = 0; i < arr.length; i += 500) { const { error } = await this.sb.from('plan').upsert(arr.slice(i, i + 500)); if (error) throw error; } },
  async deleteAll() {
    for (const [t, q] of [['plan', x => x.gte('day', '1900-01-01')], ['dishes', x => x.not('id', 'is', null)], ['catalog', x => x.neq('kind', '')]]) {
      const { error } = await q(this.sb.from(t).delete()); if (error) throw error;
    }
  },
};

const store = (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY) ? SupaStore : LocalStore;

// ── Zustand ─────────────────────────────────────────────────
const state = {
  tab: ls.get('ep.tab', 'woche'),
  week: mondayOf(new Date()),
  dishes: [],
  plan: {},           // 'YYYY-MM-DD|slot' → {day, slot, dish_id, note}
  search: '',
  cat: '',
};
const settings = Object.assign({ shortcut: 'Einkaufsliste' }, ls.get('ep.settings', {}));

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }
async function guard(fn) { try { return await fn(); } catch (e) { console.error(e); toast('Fehler: ' + (e.message || e)); } }

function normDish(d) {
  return { ...d,
    categories: (d.categories && d.categories.length) ? d.categories : (d.category ? [d.category] : []),
    ingredients: d.ingredients || [], spices: d.spices || [],
    recipe_url: d.recipe_url || '', recipe_book: d.recipe_book || '', recipe_page: d.recipe_page || '', recipe_self: !!d.recipe_self,
    role: ['main', 'base', 'side'].includes(d.role) ? d.role : 'main', needs: d.needs || [] };
}
async function loadDishes() {
  state.dishes = (await store.dishes()).map(normDish);
  state.catalog = { zutat: new Map(), gewuerz: new Map() };
  for (const e of await store.catalog()) state.catalog[e.kind]?.set(e.name_key, e);
  // auch Zutaten aus vorhandenen Gerichten vorschlagen
  for (const d of state.dishes) for (const [kind, arr] of [['zutat', d.ingredients], ['gewuerz', d.spices]])
    for (const i of arr) { const k = (i.name || '').trim().toLowerCase(); if (k && !state.catalog[kind].has(k)) state.catalog[kind].set(k, { kind, name_key: k, name: i.name.trim(), unit: i.unit || '' }); }
}
async function loadPlan() {
  const from = iso(addDays(state.week, -3)), to = iso(addDays(state.week, 6));
  state.plan = {}; for (const e of await store.plan(from, to)) state.plan[e.day + '|' + e.slot] = e;
}
const dishById = id => state.dishes.find(d => d.id === id);
// alle Gerichte eines Platzes (Hauptgericht + hinzugefügte), nur existierende
const entryNames = e => [...entryDishes(e).map(x => x.name), ...((e && e.extra_texts) || [])];
const entryDishes = e => e ? [e.dish_id, ...(e.extra_ids || [])].map(dishById).filter(Boolean) : [];
async function saveEntry(e) {
  const k = e.day + '|' + e.slot;
  // fehlt das Hauptgericht, rückt das erste hinzugefügte nach
  const ids = [e.dish_id, ...(e.extra_ids || [])].filter(id => id && dishById(id));
  e.dish_id = ids[0] || null; e.extra_ids = [...new Set(ids.slice(1))];
  e.extra_texts = (e.extra_texts || []).filter(Boolean);
  if (!e.dish_id) { e.leftover = false; e.extra_ids = []; e.extra_texts = []; }
  await guard(() => store.setSlot(e.day, e.slot, e.dish_id, e.note || '', e.leftover, e.extra_ids, e.extra_texts));
  if (e.dish_id || e.note) state.plan[k] = e; else delete state.plan[k];
}
const categories = () => [...new Set(state.dishes.flatMap(d => d.categories).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'de'));

// ── Rendering ───────────────────────────────────────────────
function render() {

  const app = $('#app');
  if (state.tab === 'woche') app.innerHTML = viewWeek();
  else if (state.tab === 'gerichte') app.innerHTML = viewDishes();
  else app.innerHTML = viewShopping();
}

function weekNav() {
  const end = addDays(state.week, 6);
  const isNow = iso(state.week) === iso(mondayOf(new Date()));
  return `<div class="weeknav">
    <button data-act="prevweek" aria-label="Vorherige Woche">‹</button>
    <div class="label" data-act="thisweek"><b>KW ${weekNo(state.week)}${isNow ? ' · diese Woche' : ''}</b><span>${fmtShort(state.week)} – ${fmtShort(end)}</span></div>
    <button data-act="nextweek" aria-label="Nächste Woche">›</button></div>`;
}

function viewWeek() {
  const today = iso(new Date());
  let html = `<div class="wrap"><header class="top"><h1>Wochenplan</h1>

  if (store.mode === 'local') html += `<div class="banner">Testmodus: Daten werden nur auf diesem Gerät gespeichert.</div>`;
  html += weekNav();
  for (let i = 0; i < 7; i++) {
    const d = addDays(state.week, i), key = iso(d);
    html += `<section class="day${key === today ? ' today' : ''}"><h3>${DAYNAMES[i]} · ${fmtShort(d)}</h3>`;
    for (const [slot, label] of SLOTS) {
      const e = state.plan[key + '|' + slot]; const all = entryDishes(e); const dish = all[0];
      let what;
      if (dish) what = `<span class="what">${e.leftover ? '<span class="leftover">🍱 Reste</span> ' : ''}${entryNames(e).map(esc).join(' <span class="plus">+</span> ')}${dish.categories.length && !e.leftover ? `<div class="cat">${esc(dish.categories.join(', '))}</div>` : ''}${e.note ? `<div class="cat note">📝 ${esc(e.note)}</div>` : ''}</span>`;
      else if (e && e.note) what = `<span class="what note">${esc(e.note)}</span>`;

// Einkaufsliste aus dem Wochenplan zusammenrechnen
function parseAmount(a) { if (a == null || a === '') return null; const n = Number(String(a).replace(',', '.').trim()); return isFinite(n) ? n : NaN; }
function fmtNum(n) { return Number.isInteger(n) ? String(n) : n.toLocaleString('de-DE', { maximumFractionDigits: 2 }); }
function shoppingItems(field = 'ingredients') {
  // field: 'ingredients' (Pflicht-Zutaten), 'optional' (optionale Zutaten), 'spices'
  const map = new Map();
  const wFrom = iso(state.week), wTo = iso(addDays(state.week, 6));
  for (const e of Object.values(state.plan)) {
    if (e.leftover || e.day < wFrom || e.day > wTo) continue;
    for (const dish of entryDishes(e)) {
    const src = field === 'spices' ? dish.spices : dish.ingredients.filter(i => field === 'optional' ? i.optional : !i.optional);
    for (const ing of src) {
      const name = (ing.name || '').trim(); if (!name) continue;
      const unit = ing.unit || ''; const key = name.toLowerCase() + '|' + unit;
      let it = map.get(key); if (!it) { it = { key, name, unit, sum: 0, hasNum: false, extra: [], dishes: new Set() }; map.set(key, it); }
      const n = parseAmount(ing.amount);
      if (n === null) {} else if (isNaN(n)) it.extra.push(ing.amount); else { it.sum += n; it.hasNum = true; }
      it.dishes.add(dish.name);
    }
    }
  }
  const extras = field === 'ingredients' ? ls.get('ep.extra.' + iso(state.week), []) : [];
  for (const x of extras) map.set('extra|' + x, { key: 'extra|' + x, name: x, unit: '', sum: 0, hasNum: false, extra: [], dishes: new Set(), isExtra: true });
  return [...map.values()].sort((a, b) => a.name.localeCompare(b.name, 'de'));
}
function itemText(it) {
  const parts = [];
  let sum = it.sum, unit = it.unit;
  if (unit === 'g' && sum >= 1000) { sum /= 1000; unit = 'kg'; }
  if (unit === 'ml' && sum >= 1000) { sum /= 1000; unit = 'l'; }
  if (it.hasNum) parts.push(fmtNum(sum) + (unit ? ' ' + unit : ''));
  else if (it.unit && !it.extra.length) parts.push(it.unit);
  if (it.extra.length) parts.push(it.extra.join(' + ') + (it.unit && !it.hasNum ? ' ' + it.unit : ''));
  return parts.length ? `${it.name} (${parts.join(' + ')})` : it.name;
}

function viewShopping() {
  const items = shoppingItems();
  const spices = shoppingItems('spices');

  }
  if (spices.length) {

        <div class="main"><div>${esc(itemText(it))}</div><div class="sub">${esc([...it.dishes].join(', '))}</div></div></button>`).join('') + `</div>`;
  }

    <button class="btn" data-act="copy" ${n ? '' : 'disabled'}>Kopieren</button><button class="btn" data-act="share" ${n ? '' : 'disabled'}>Teilen …</button></div>`;
  return html + `</div>`;
}

function listText() {
  const have = new Set(ls.get('ep.have.' + iso(state.week), []));

// zuletzt gekochtes Gericht vor diesem Platz (max. 3 Tage zurück).
// Jedes Original darf nur einmal als Reste verwendet werden.
function slotPos(day, slot) { return Math.round(parseISO(day) / 864e5) * SLOTS.length + SLOTS.findIndex(x => x[0] === slot); }
function availableLeftovers(day, slot) {
  const order = SLOTS.map(x => x[0]); const target = slotPos(day, slot);
  const entries = Object.values(state.plan); const found = [];
  let d = parseISO(day), i = order.indexOf(slot);
  for (let step = 0; step < 3 * order.length; step++) {
    i--; if (i < 0) { i = order.length - 1; d = addDays(d, -1); }
    const e = state.plan[iso(d) + '|' + order[i]]; const dish = e && !e.leftover && dishById(e.dish_id);
    if (!dish) continue;
    const orig = slotPos(e.day, e.slot);
    const used = entries.some(x => x.leftover && x.dish_id === dish.id && slotPos(x.day, x.slot) > orig
      && slotPos(x.day, x.slot) !== target && slotPos(x.day, x.slot) <= orig + 3 * order.length);
    if (used || found.some(f => f.dish.id === dish.id)) continue;
    const diff = Math.round((parseISO(day) - d) / 864e5);
    const when = diff === 0 ? 'heute' : diff === 1 ? 'gestern' : DAYNAMES[(d.getDay() + 6) % 7];
    found.push({ dish, src: e.day + '|' + e.slot, names: entryNames(e).join(' + '), label: `${when} ${SLOTS[i][1]}` });
  }
  return found;
}

function pickerHtml(day, slot, add = false) {

    <div class="sheet-body">${add ? `<p class="hint" style="margin-top:0">${base ? `Was gibt's zu <b>${esc(names)}</b>?${base.needs.length ? ` (braucht: ${esc(base.needs.join(', '))})` : ''}` : `Zu <b>${esc(names)}</b> hinzufügen:`}</p>` : ''}<input class="search" id="pick-search" type="search" placeholder="Gericht suchen">
    ${state.dishes.length ? body : '<div class="empty-state">Noch keine Gerichte angelegt.</div>'}

    <div class="addrow" style="margin-top:0"><input class="in" id="pick-text" placeholder="Freitext"><button class="btn" data-act="addtext">OK</button></div>
    ${base ? '<button class="btn full" style="margin-top:10px" data-act="backtodetail">Ohne Ergänzung fertig</button>' : ''}` : `<label class="f">Bemerkung oder Freitext (z. B. Reste, doppelte Portion)</label>
    <div class="addrow" style="margin-top:0"><input class="in" id="pick-note" value="${esc(e && !e.dish_id ? e.note : '')}" placeholder="Freitext"><button class="btn" data-act="savenote">OK</button></div>`}
    <button class="btn full" style="margin-top:14px" data-act="newdish-from-pick">+ Neues Gericht anlegen</button></div></div>`;
}

const KIND_LABEL = { zutat: 'Zutat', gewuerz: 'Gewürz' };
function ingRow(i = {}, kind = 'zutat') {

function download(name, text, type) {
  const blob = new Blob([text], { type }); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
async function doBackup() {
  const data = { app: 'essensplaner', version: 1, exported_at: new Date().toISOString(),
    dishes: await store.dishes(), plan: await store.plan('1900-01-01', '2999-12-31'), catalog: await store.catalog() };
  download(`Essensplaner-Sicherung-${iso(new Date())}.json`, JSON.stringify(data, null, 1), 'application/json');
  toast(`Gesichert: ${data.dishes.length} Gerichte`);
}
async function doRestore(file) {
  let data; try { data = JSON.parse(await file.text()); } catch { return toast('Datei ist keine gültige Sicherung'); }
  if (data.app !== 'essensplaner' || !Array.isArray(data.dishes)) return toast('Datei ist keine Essensplaner-Sicherung');
  restorePending = data;
  openSheet(`<div class="sheet"><div class="sheet-head"><button data-act="close">Abbrechen</button><b>Sicherung laden</b><span></span></div><div class="sheet-body">
    <p>Sicherung vom <b>${esc(new Date(data.exported_at).toLocaleString('de-DE'))}</b> mit <b>${data.dishes.length} Gerichten</b>.</p>
    <button class="btn primary full" data-act="restore-merge">Ergänzen</button>
    <p class="hint">Fehlende Gerichte kommen dazu, vorhandene werden auf den Stand der Sicherung gebracht. Nichts wird gelöscht.</p>
    <button class="btn danger full" style="border:1px solid var(--danger)" data-act="restore-replace">Alles ersetzen</button>
    <p class="hint">Löscht alle aktuellen Gerichte und Wochenpläne und spielt die Sicherung ein.</p></div></div>`);
}
let restorePending = null;
async function applyRestore(replace) {
  const data = restorePending; if (!data) return;
  if (replace && !confirm('Wirklich alle aktuellen Gerichte und Wochenpläne löschen und durch die Sicherung ersetzen? Das lässt sich nicht rückgängig machen.')) return;
  restorePending = null;
  const dishes = data.dishes.map(normDish);
  const ids = new Set(dishes.map(d => d.id));
  const plan = (data.plan || []).filter(e => !e.dish_id || ids.has(e.dish_id) || state.dishes.some(d => d.id === e.dish_id));
  await guard(async () => {
    if (replace) await store.deleteAll();
    await store.saveDishes(dishes); await store.savePlan(plan); await store.saveCatalog(data.catalog || []);
    await loadDishes(); await loadPlan();
    closeSheet(); render(); toast(`${dishes.length} Gerichte ${replace ? 'wiederhergestellt' : 'übernommen'}`);
  });
}

const CSV_HEAD = ['Name', 'Kategorien', 'Zutaten', 'Gewürze', 'Rezeptbuch', 'Seite', 'Rezept-Link', 'Selbst erfasst', 'Typ', 'Braucht'];
function csvTemplate() {
  const rows = [CSV_HEAD,
    ['Spaghetti Bolognese', 'Pasta, Fleisch, Italienisch', '500 g Hackfleisch | 400 g Spaghetti | 1 Dose Tomaten | 1 Stk Zwiebel | 50 g Parmesan (optional)', '1 TL Oregano | 1 Prise Salz | Pfeffer', 'Kochbuch Oma', '45', '', 'nein', 'Gericht', ''],
    ['Gemüsesuppe', 'Suppe, Vegetarisch, Schnell', '1 kg Suppengemüse | 1 l Gemüsebrühe | 2 Stk Kartoffeln', 'Salz | Pfeffer | 1 Bund Petersilie (optional)', '', '', '', 'ja', 'Gericht', ''],
    ['Selbstgemachte Nudeln', 'Pasta, Vegetarisch', '500 g Mehl | 5 Stk Eier', 'Salz', '', '', '', 'ja', 'Braucht Ergänzung', 'Soße'],
    ['Tomatensoße', 'Soße, Vegetarisch', '2 Dose Tomaten | 1 Stk Zwiebel', '1 TL Oregano | Salz', '', '', '', 'ja', 'Ergänzung', ''],
  ];
  return '\ufeff' + rows.map(r => r.map(c => /[;"\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c).join(';')).join('\r\n') + '\r\n';
}
function parseCSV(text) {
  text = text.replace(/^\ufeff/, '');
  const first = text.split(/\r?\n/)[0];
  const delim = [';', '\t', ','].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
function parseIngredients(txt) {
  const unitMap = new Map(UNITS.filter(Boolean).map(u => [u.toLowerCase(), u]));
  for (const [a, b] of [['gramm', 'g'], ['stück', 'Stk'], ['stk.', 'Stk'], ['liter', 'l'], ['päckchen', 'Pck'], ['pck.', 'Pck'], ['dosen', 'Dose'], ['zehen', 'Zehe'], ['scheiben', 'Scheibe']]) unitMap.set(a, b);
  return String(txt || '').split(/\s*[|\n]\s*/).map(x => x.trim()).filter(Boolean).map(x => {
    let optional = false;
    x = x.replace(/\s*\((optional|opt\.?)\)\s*$/i, () => { optional = true; return ''; }).trim();
    const m = x.match(/^([\d.,/½¼¾]+)?\s*(\S+)?\s*(.*)$/);
    let amount = '', unit = '', name = x;
    if (m && m[1]) {
      amount = m[1];
      const u = unitMap.get((m[2] || '').toLowerCase());
      if (u && m[3]) { unit = u; name = m[3]; } else name = [m[2], m[3]].filter(Boolean).join(' ');
    }
    return { amount, unit, name: name.trim(), optional };
  }).filter(i => i.name);
}
async function doCsvImport(file) {
  const rows = parseCSV(await file.text());
  if (rows.length < 2) return toast('Keine Gerichte in der Datei gefunden');
  const head = rows[0].map(h => h.trim().toLowerCase());
  const col = name => head.indexOf(name.toLowerCase());
  if (col('Name') < 0) return toast('Spalte „Name“ fehlt – bitte die Vorlage verwenden');
  const get = (r, n) => { const i = col(n); return i >= 0 ? (r[i] || '').trim() : ''; };
  const existing = new Set(state.dishes.map(d => d.name.trim().toLowerCase()));
  const dishes = []; let skipped = 0;
  for (const r of rows.slice(1)) {
    const name = get(r, 'Name'); if (!name) continue;
    if (existing.has(name.toLowerCase())) { skipped++; continue; }
    existing.add(name.toLowerCase());
    const self = /^(ja|j|x|yes|1|wahr|true)$/i.test(get(r, 'Selbst erfasst'));
    const cats = [...new Set(get(r, 'Kategorien').split(/\s*[,|]\s*/).filter(Boolean))];
    const typ = get(r, 'Typ').toLowerCase();
    const role = /braucht|basis|base/.test(typ) ? 'base' : /ergänz|beilage|soße|sosse|side/.test(typ) ? 'side' : 'main';
    const needs = role === 'base' ? [...new Set(get(r, 'Braucht').split(/\s*[,|]\s*/).filter(Boolean))] : [];
    dishes.push(normDish({ id: uid(), name, categories: cats, category: cats[0] || '', role, needs,
      ingredients: parseIngredients(get(r, 'Zutaten')), spices: parseIngredients(get(r, 'Gewürze')), recipe_self: self,
      recipe_book: self ? '' : get(r, 'Rezeptbuch'), recipe_page: self ? '' : get(r, 'Seite'), recipe_url: self ? '' : get(r, 'Rezept-Link') }));
  }
  if (!dishes.length) return toast(skipped ? `Alle ${skipped} Gerichte gibt es schon` : 'Keine Gerichte gefunden');
  if (!confirm(`${dishes.length} neue Gerichte einlesen?${skipped ? `\n(${skipped} schon vorhanden – werden übersprungen)` : ''}`)) return;
  const cat = [];
  for (const d of dishes) for (const [kind, arr] of [['zutat', d.ingredients], ['gewuerz', d.spices]]) for (const i of arr) cat.push({ kind, name_key: i.name.toLowerCase(), name: i.name, unit: i.unit });
  const uniq = [...new Map(cat.map(x => [x.kind + '|' + x.name_key, x])).values()];
  await guard(async () => {
    await store.saveDishes(dishes); await store.saveCatalog(uniq); await loadDishes();
    closeSheet(); state.tab = 'gerichte'; render(); toast(`${dishes.length} Gerichte importiert`);
  });
}

async function refreshWeek() { await guard(loadPlan); render(); }

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act], [data-tab]'); if (!el) return;
  if (!state.loggedIn) return;
  if (el.dataset.tab) { state.tab = el.dataset.tab; ls.set('ep.tab', state.tab); render(); window.scrollTo(0, 0); return; }
  const act = el.dataset.act;
  switch (act) {
    case 'prevweek': state.week = addDays(state.week, -7); return refreshWeek();
    case 'nextweek': state.week = addDays(state.week, 7); return refreshWeek();
    case 'thisweek': state.week = mondayOf(new Date()); return refreshWeek();
    case 'close': return closeSheet();
    case 'settings': return openSheet(settingsHtml());
    case 'logout': await store.logout(); location.reload(); return;
    case 'cat': state.cat = el.dataset.cat; return render();
    case 'pick': {
      const { day, slot } = el.dataset; const e = state.plan[day + '|' + slot];
      return openSheet(e && dishById(e.dish_id) ? slotDetailHtml(day, slot) : pickerHtml(day, slot));
    }
    case 'unpick': {
      const sh = el.closest('.sheet'); const { day, slot } = sh.dataset; const note = $('#plan-note').value.trim();
      await saveEntry({ day, slot, dish_id: null, note });
      render(); return openSheet(pickerHtml(day, slot));
    }
    case 'addtext': {
      const sh = el.closest('.sheet'); const { day, slot } = sh.dataset; const t = $('#pick-text').value.trim(); if (!t) return;
      const e = { ...state.plan[day + '|' + slot] }; e.extra_texts = [...(e.extra_texts || []), t];
      await saveEntry(e); render(); return openSheet(slotDetailHtml(day, slot));
    }
    case 'removetext': {
      const sh = el.closest('.sheet'); const { day, slot } = sh.dataset; const e = { ...state.plan[day + '|' + slot] };
      e.extra_texts = (e.extra_texts || []).filter((_, i) => i !== +el.dataset.i);
      await saveEntry(e); render(); return openSheet(slotDetailHtml(day, slot));
    }
    case 'setrole': {
      dlg.querySelectorAll('[data-act=setrole]').forEach(b => b.classList.toggle('on', b === el));
      $('#needs-box').hidden = el.dataset.role !== 'base'; return;
    }
    case 'adddish': { const sh = el.closest('.sheet'); return openSheet(pickerHtml(sh.dataset.day, sh.dataset.slot, true)); }
    case 'backtodetail': { const sh = el.closest('.sheet'); return openSheet(slotDetailHtml(sh.dataset.day, sh.dataset.slot)); }
    case 'removedish': {
      const sh = el.closest('.sheet'); const { day, slot } = sh.dataset; const e = { ...state.plan[day + '|' + slot] };
      const id = el.dataset.id;
      if (e.dish_id === id) e.dish_id = null; e.extra_ids = (e.extra_ids || []).filter(x => x !== id);
      await saveEntry(e); render();
      return openSheet(entryDishes(state.plan[day + '|' + slot]).length ? slotDetailHtml(day, slot) : pickerHtml(day, slot));
    }
    case 'choose': case 'chooseleftover': case 'clearslot': case 'savenote': {
      const sh = el.closest('.sheet'); const { day, slot } = sh.dataset;
      if (sh.dataset.add && act === 'choose') {
        const e = { ...state.plan[day + '|' + slot] }; e.extra_ids = [...(e.extra_ids || []), el.dataset.id];
        await saveEntry(e); render(); return openSheet(slotDetailHtml(day, slot));
      }
      const dish_id = (act === 'choose' || act === 'chooseleftover') ? el.dataset.id : null;
      const note = act === 'clearslot' ? '' : $('#pick-note').value.trim();
      const leftover = act === 'chooseleftover';
      const srcE = leftover ? state.plan[el.dataset.src] : null;
      const extra_ids = srcE ? [...(srcE.extra_ids || [])] : [];
      const extra_texts = srcE ? [...(srcE.extra_texts || [])] : [];
      await saveEntry({ day, slot, dish_id, note, leftover, extra_ids, extra_texts });
      // braucht das Gericht eine Ergänzung (z. B. Soße)? -> direkt weiter zur Auswahl
      const chosen = dishById(dish_id);
      if (act === 'choose' && chosen && chosen.role === 'base') { render(); return openSheet(pickerHtml(day, slot, true)); }
      closeSheet(); return render();
    }
    case 'newdish': return openSheet(dishFormHtml());
    case 'newdish-from-pick': { const sh = el.closest('.sheet'); dlg.dataset.after = sh.dataset.day + '|' + sh.dataset.slot; if (sh.dataset.add) dlg.dataset.addmode = '1'; return openSheet(dishFormHtml()); }
    case 'editdish': return openSheet(dishFormHtml(dishById(el.dataset.id)));
    case 'addingr': { const k = el.dataset.kind; $('#ings-' + k).insertAdjacentHTML('beforeend', ingRow({}, k)); $(`#ings-${k} .ing:last-child input[name=amount]`).focus(); return; }
    case 'delingr': return el.closest('.ing').remove();
    case 'deldish': {
      const id = $('#dishform').dataset.id; const d = dishById(id);
      if (!confirm(`„${d.name}“ wirklich löschen? Es wird auch aus allen Wochenplänen entfernt.`)) return;
      await guard(() => store.deleteDish(id));
      state.dishes = state.dishes.filter(x => x.id !== id);
      for (const k in state.plan) {
        const e = state.plan[k]; if (e.dish_id !== id && !(e.extra_ids || []).includes(id)) continue;
        if (e.dish_id === id) e.dish_id = null; e.extra_ids = (e.extra_ids || []).filter(x => x !== id);
        await saveEntry({ ...e });
      }
      closeSheet(); return render();
    }
    case 'toggle': {
      const k = 'ep.have.' + iso(state.week); const have = new Set(ls.get(k, []));
      have.has(el.dataset.key) ? have.delete(el.dataset.key) : have.add(el.dataset.key); ls.set(k, [...have]); return render();
    }
    case 'togglespice': {
      const k = 'ep.spice.' + iso(state.week); const s = new Set(ls.get(k, []));
      s.has(el.dataset.key) ? s.delete(el.dataset.key) : s.add(el.dataset.key); ls.set(k, [...s]); return render();
    }
    case 'backup': return guard(doBackup);
    case 'restore': return $('#file-backup').click();
    case 'csvtemplate': return download('Essensplaner-Vorlage.csv', csvTemplate(), 'text/csv;charset=utf-8');
    case 'csvimport': return $('#file-csv').click();
    case 'restore-merge': return applyRestore(false);
    case 'restore-replace': return applyRestore(true);
    case 'toggleleftover': {
      const sh = el.closest('.sheet'); const { day, slot } = sh.dataset; const ent = state.plan[day + '|' + slot]; if (!ent) return;
      await saveEntry({ ...ent, leftover: !ent.leftover });
      render(); return openSheet(slotDetailHtml(day, slot));
    }
    case 'togglecat': return el.classList.toggle('on');
    case 'pickcat': picker.cat = picker.cat === el.dataset.cat ? null : el.dataset.cat; return refreshPicker();
    case 'random': {
      const pool = randomPool(); if (!pool.length) return toast('Keine Gerichte in dieser Auswahl');
      const others = pool.length > 1 ? pool.filter(x => x.id !== picker.random) : pool;
      picker.random = others[Math.floor(Math.random() * others.length)].id; refreshPicker();
      dlg.querySelector('.sheet-body').scrollTop = 0; return;
    }
    case 'toggleopt': { el.classList.toggle('on'); el.setAttribute('aria-pressed', el.classList.contains('on')); return; }
    case 'addcat': return addCat();
    case 'addextra': return addExtra();
    case 'copy': { const t = listText(); try { await navigator.clipboard.writeText(t); toast('Liste kopiert'); } catch { prompt('Liste kopieren:', t); } return; }
    case 'share': { const t = listText(); if (navigator.share) { try { await navigator.share({ title: 'Einkaufsliste', text: t }); } catch {} } else { try { await navigator.clipboard.writeText(t); toast('Teilen nicht verfügbar – Liste kopiert'); } catch {} } return; }
    case 'toreminders': {
      const t = listText();
      location.href = 'shortcuts://run-shortcut?name=' + encodeURIComponent(settings.shortcut) + '&input=text&text=' + encodeURIComponent(t);
      return;
    }
  }
});

function addExtra() {
  const inp = $('#extra'); const v = inp.value.trim(); if (!v) return;
  const k = 'ep.extra.' + iso(state.week); const ex = ls.get(k, []); if (!ex.includes(v)) ex.push(v); ls.set(k, ex);
  render(); $('#extra').focus();
}

document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'extra') { e.preventDefault(); addExtra(); }
  if (e.key === 'Enter' && e.target.id === 'pick-note') { e.preventDefault(); $('[data-act=savenote]').click(); } });

document.addEventListener('input', e => {
  if (e.target.id === 'search') { state.search = e.target.value; const pos = e.target.selectionStart; render(); const s = $('#search'); s.focus(); s.setSelectionRange(pos, pos); }
  if (e.target.id === 'set-shortcut') { settings.shortcut = e.target.value.trim() || 'Einkaufsliste'; ls.set('ep.settings', settings); }
  if (e.target.id === 'pick-search') { picker.q = e.target.value; refreshPicker(); }
});

// Checkbox "Rezept selbst erfasst" & Einheit aus gespeicherter Zutat übernehmen
document.addEventListener('change', e => {
  if (e.target.id === 'recipe_self') $('#recipe-src').hidden = e.target.checked;
  if (e.target.id === 'plan-note') {
    const sh = e.target.closest('.sheet'); const { day, slot } = sh.dataset; const k = day + '|' + slot; const ent = state.plan[k];
    if (ent) saveEntry({ ...ent, note: e.target.value.trim() }).then(() => { render(); toast('Bemerkung gespeichert'); });
  }
  if (e.target.id === 'file-backup' && e.target.files[0]) { doRestore(e.target.files[0]); e.target.value = ''; }
  if (e.target.id === 'file-csv' && e.target.files[0]) { doCsvImport(e.target.files[0]); e.target.value = ''; }
  if (e.target.name === 'name' && e.target.closest('.ing')) {
    const row = e.target.closest('.ing'); const unit = row.querySelector('[name=unit]');
    const hit = state.catalog?.[row.dataset.kind]?.get(e.target.value.trim().toLowerCase());
    if (hit && !unit.value && hit.unit) unit.value = hit.unit;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'newcat') { e.preventDefault(); addCat(); }
  if (e.key === 'Enter' && e.target.id === 'pick-text') { e.preventDefault(); $('[data-act=addtext]').click(); } });

document.addEventListener('submit', async e => {
  if (e.target.id !== 'dishform') return; e.preventDefault();
  const f = e.target;
  const rows = kind => [...f.querySelectorAll(`.ing[data-kind=${kind}]`)].map(r => ({
    amount: r.querySelector('[name=amount]').value.trim(), unit: r.querySelector('[name=unit]').value, name: r.querySelector('[name=name]').value.trim(),
    optional: r.querySelector('.opt').classList.contains('on'),
  })).filter(i => i.name);
  const ingredients = rows('zutat'), spices = rows('gewuerz');
  const cats = [...f.querySelectorAll('#catchips .chip.on')].map(c => c.dataset.cat);
  const self = f.recipe_self.checked;
  const role = f.querySelector('[data-act=setrole].on')?.dataset.role || 'main';
  const needs = role === 'base' ? [...f.querySelectorAll('#needschips .chip.on')].map(c => c.dataset.need) : [];
  const d = { id: f.dataset.id, name: f.dname.value.trim(), categories: cats, category: cats[0] || '', role, needs, ingredients, spices, recipe_self: self,
    recipe_book: self ? '' : f.recipe_book.value.trim(), recipe_page: self ? '' : f.recipe_page.value.trim(), recipe_url: self ? '' : f.recipe_url.value.trim() };
  if (!d.name) return;
  const ok = await guard(() => store.saveDish(d)); if (!ok) return;
  // Zutaten/Gewürze für spätere Vorschläge merken
  const entries = [...ingredients.map(i => ['zutat', i]), ...spices.map(i => ['gewuerz', i])]
    .map(([kind, i]) => ({ kind, name_key: i.name.toLowerCase(), name: i.name, unit: i.unit || '' }));
  const uniq = [...new Map(entries.map(x => [x.kind + '|' + x.name_key, x])).values()];
  await guard(() => store.saveCatalog(uniq));
  for (const x of uniq) state.catalog[x.kind].set(x.name_key, x);
  const i = state.dishes.findIndex(x => x.id === d.id); if (i >= 0) state.dishes[i] = d; else state.dishes.push(d);
  const after = dlg.dataset.after; delete dlg.dataset.after;
  const addmode = dlg.dataset.addmode; delete dlg.dataset.addmode;
  if (after) {
    const [day, slot] = after.split('|'); const cur = state.plan[after];
    if (addmode && cur) { await saveEntry({ ...cur, extra_ids: [...(cur.extra_ids || []), d.id] }); closeSheet(); render(); return openSheet(slotDetailHtml(day, slot)); }
    await saveEntry({ day, slot, dish_id: d.id, note: cur?.note || '' });
  }
  closeSheet(); toast('Gespeichert'); render();
});

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && store.mode === 'cloud' && !dlg.open) { await guard(async () => { await loadDishes(); await loadPlan(); }); render(); }
});

// ── Login & Start ──────────────────────────────────────────
function loginView(msg = '') {
  $('#tabs').hidden = true;
  $('#app').innerHTML = `<form class="login" id="loginform"><h1>Essensplaner</h1><p class="hint">Mit dem Familien-Zugang anmelden.</p>
    <label class="f">E-Mail</label><input class="in" name="email" type="email" autocomplete="username" required>
    <label class="f">Passwort</label><input class="in" name="pw" type="password" autocomplete="current-password" required>
    ${msg ? `<p class="hint" style="color:var(--danger)">${esc(msg)}</p>` : ''}
    <button class="btn primary full" style="margin-top:18px">Anmelden</button></form>`;
  $('#loginform').addEventListener('submit', async e => {
    e.preventDefault();
    try { await store.login(e.target.email.value.trim(), e.target.pw.value); start(); }
    catch (err) { loginView('Anmeldung fehlgeschlagen: ' + (err.message || err)); }
  });
}

async function start() {
  try { await store.init(); } catch (e) { $('#app').innerHTML = `<div class="empty-state">Verbindung fehlgeschlagen.<br>${esc(e.message || e)}</div>`; return; }
  if (!(await store.session())) { state.loggedIn = false; return loginView(); }
  state.loggedIn = true;
  $('#tabs').hidden = false;
  $('#app').innerHTML = `<div class="empty-state">Lade …</div>`;
  await guard(async () => { await loadDishes(); await loadPlan(); });
  render();
}
start();
</script>
</body>
</html>
