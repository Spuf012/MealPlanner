<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Essensplaner">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Essensplaner</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
    --line: #e4e2dd; --accent: #2f7d4f; --accent-soft: #e3f1e8; --danger: #c0392b;
    --chip: #efede8; --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --card: #22242a; --text: #f2f2f2; --muted: #9a9ca3;
      --line: #33363d; --accent: #5cc08a; --accent-soft: #1f3a2b; --danger: #ff6b5b;
      --chip: #2c2f36;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom)); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 12px 16px 24px; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0 14px; }
  header.top h1 { font-size: 28px; margin: 0; letter-spacing: -0.02em; }
  .iconbtn { border: 0; background: var(--chip); border-radius: 999px; min-width: 40px; height: 40px; padding: 0 12px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; }
  .iconbtn.primary { background: var(--accent); color: #fff; }
  .weeknav { display: flex; align-items: center; justify-content: space-between; background: var(--card);
    border-radius: var(--radius); padding: 6px; margin-bottom: 14px; border: 1px solid var(--line); }
  .weeknav button { border: 0; background: transparent; width: 44px; height: 40px; border-radius: 10px; font-size: 20px; }
  .weeknav button:active { background: var(--chip); }
  .weeknav .label { text-align: center; }
  .weeknav .label b { display: block; }
  .weeknav .label span { font-size: 13px; color: var(--muted); }
  .day { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
  .day.today { border-color: var(--accent); }
  .day h3 { margin: 0; padding: 10px 14px 4px; font-size: 14px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .day.today h3 { color: var(--accent); }
  .slot { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; text-align: left;
    padding: 10px 14px; border-top: 1px solid var(--line); }
  .slot:first-of-type { border-top: 0; }
  .slot:active { background: var(--chip); }
  .slot .when { width: 56px; flex: none; font-size: 13px; color: var(--muted); }
  .slot .what { flex: 1; font-weight: 500; }
  .slot .what.empty { color: var(--muted); font-weight: 400; }
  .slot .what.note { font-style: italic; }
  .slot .cat { font-size: 12px; color: var(--muted); }
  .search { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); margin-bottom: 10px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; scrollbar-width: none; }
  .chip { flex: none; border: 0; background: var(--chip); padding: 6px 12px; border-radius: 999px; font-size: 14px; }
  .chip.on { background: var(--accent); color: #fff; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); width: 100%;
    border-left: 0; border-right: 0; border-bottom: 0; background: transparent; text-align: left; }
  .row:first-child { border-top: 0; }
  .row:active { background: var(--chip); }
  .row .main { flex: 1; min-width: 0; }
  .row .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.done .main { opacity: .45; text-decoration: line-through; }
  .check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--muted); flex: none; display: grid; place-items: center; }
  .row:not(.done):not(.spice) .check, .row.spice.on .check { border-color: var(--accent); background: var(--accent); }
  .row:not(.done):not(.spice) .check::after, .row.spice.on .check::after { content: "✓"; color: #fff; font-size: 14px; font-weight: 700; }
  .catchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .catlabel { font-size: 12px; color: var(--muted); margin: 10px 4px 5px; }
  .catgroup:first-child .catlabel { margin-top: 0; }
  .cbx { display: flex; align-items: center; gap: 10px; margin: 16px 4px 4px; font-weight: 500; }
  .cbx input { width: 22px; height: 22px; accent-color: var(--accent); }
  .empty-state { text-align: center; color: var(--muted); padding: 40px 20px; }
  .hint { font-size: 13px; color: var(--muted); margin: 8px 4px 14px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
  .btn { border: 0; border-radius: 12px; padding: 13px 14px; font-weight: 600; background: var(--chip); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.danger { background: transparent; color: var(--danger); }
  .btn.full { grid-column: 1 / -1; width: 100%; }
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); z-index: 10; }
  nav.tabs button { flex: 1; max-width: 160px; border: 0; background: transparent; padding: 6px 0; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; }
  nav.tabs button svg { width: 26px; height: 26px; }
  nav.tabs button.on { color: var(--accent); }
  dialog { border: 0; padding: 0; width: min(560px, 100%); max-width: 100%; max-height: 92vh; background: var(--bg); color: var(--text);
    border-radius: 18px 18px 0 0; margin: auto auto 0; }
  @media (min-width: 700px) { dialog { border-radius: 18px; margin: auto; } }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .sheet { display: flex; flex-direction: column; max-height: 92vh; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .sheet-head b { font-size: 17px; }
  .sheet-head button { border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 4px; }
  .sheet-body { overflow-y: auto; padding: 14px 16px calc(20px + env(safe-area-inset-bottom)); }
  label.f { display: block; font-size: 13px; color: var(--muted); margin: 12px 4px 6px; }
  .in { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
  .ing { display: grid; grid-template-columns: 56px 92px 1fr 40px 28px; gap: 5px; margin-bottom: 6px; align-items: center; }
  .ing .opt { border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 8px; height: 38px; font-size: 12px; font-weight: 600; padding: 0; }
  .ing .opt.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .leftover { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 1px 7px; border-radius: 999px; margin-right: 4px; vertical-align: 1px; }
  .leftover-sugg { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; border: 1px dashed var(--accent); background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; }
  .leftover-sugg > span:first-child { font-size: 24px; }
  .leftover-toggle { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 14px; margin-top: 16px; }
  .leftover-toggle .sw { flex: none; width: 44px; height: 26px; border-radius: 999px; background: var(--chip); position: relative; transition: background .15s; }
  .leftover-toggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: left .15s; }
  .leftover-toggle.on { border-color: var(--accent); }
  .leftover-toggle.on .sw { background: var(--accent); }
  .leftover-toggle.on .sw::after { left: 21px; }
  .seg { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .instr { white-space: pre-wrap; margin: 6px 4px; line-height: 1.55; }
  .why-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .why-chip { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 3px 9px; font-size: 13px; font-weight: 600; }
  .why-chip small { font-weight: 500; opacity: .85; }
  .why-chip.opt { background: transparent; border: 1px dashed var(--accent); }
  .why-chip.name { background: var(--chip); color: var(--muted); }
  .row mark, .why-chip mark { background: transparent; color: inherit; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 2px; }
  .shop-sec { margin-bottom: 12px; }
  .shop-sec > summary { list-style: none; display: flex; align-items: center; gap: 8px; cursor: pointer; margin: 14px 4px 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .shop-sec > summary::-webkit-details-marker { display: none; }
  .shop-sec > summary::before { content: "›"; font-size: 18px; line-height: 1; transition: transform .15s; }
  .shop-sec[open] > summary::before { transform: rotate(90deg); }
  .shop-count { margin-left: auto; text-transform: none; letter-spacing: 0; background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: 12px; }
  .leftover-group { display: inline; border: 1.5px solid var(--accent); border-radius: 999px; padding: 1px 9px 1px 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; line-height: 1.9; }
  .leftover-group .leftover { margin-right: 2px; }
  .lo-chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; }
  .lo-chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .plus { color: var(--muted); font-weight: 400; }
  .dishblock { padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
  .dishhead { display: flex; align-items: center; gap: 8px; }
  .dishhead h2 { margin: 4px 4px 2px; flex: 1; font-size: 22px; }
  .dishhead .rm { border: 0; background: var(--chip); border-radius: 50%; width: 30px; height: 30px; font-size: 18px; color: var(--muted); }
  details summary { cursor: pointer; color: var(--accent); font-weight: 600; margin: 10px 4px 4px; }
  .inglist { margin: 0 4px; padding-left: 20px; }
  .inglist li { margin: 3px 0; }
  textarea.in { resize: vertical; font: inherit; }
  .opt-tag { font-size: 12px; color: var(--accent); font-weight: 600; }
  .ing .in { padding: 10px 8px; }
  .ing [data-act=delingr] { border: 0; background: transparent; color: var(--danger); font-size: 20px; padding: 0; }
  .group-title { font-size: 13px; color: var(--muted); margin: 16px 4px 6px; text-transform: uppercase; letter-spacing: .04em; }
  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0;
    transition: opacity .2s; pointer-events: none; z-index: 50; }
  .toast.show { opacity: 1; }
  .login { max-width: 380px; margin: 12vh auto 0; padding: 0 20px; }
  .login h1 { font-size: 30px; margin-bottom: 4px; }
  .banner { background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
  .addrow { display: flex; gap: 8px; margin-top: 12px; }
  .addrow .in { flex: 1; }
  .hm-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
  .hm-head { display: flex; align-items: baseline; gap: 10px; }
  .hm-head b { flex: 1; font-size: 17px; cursor: pointer; }
  .hm-meta { font-size: 13px; color: var(--muted); margin: 2px 0 8px; }
  .hm-foot { display: flex; align-items: flex-end; gap: 8px; }
  .hm-chips { flex: 1; display: flex; flex-wrap: wrap; gap: 6px; }
  .hm-chip { border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600; background: var(--accent-soft); color: var(--accent); }
  .hm-chip.miss { background: transparent; border: 1px dashed var(--muted); color: var(--muted); font-weight: 500; }
  .hm-chip.opt { opacity: .6; }
  .hm-add { flex: none; border: 0; background: var(--chip); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; color: var(--accent); }
  .hm-pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .hm-pick .chip { margin: 0; }
  .hm-sel { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
  .hm-sel .chip::after { content: " ✕"; font-size: 11px; opacity: .8; }
  .hm-slots { display: grid; grid-template-columns: auto 1fr 1fr; gap: 6px; align-items: center; }
  .hm-slots .d { font-size: 14px; font-weight: 600; padding-right: 6px; }
  .hm-slots .d span { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
  .hm-slot { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px; min-height: 44px; font-size: 13px; text-align: left; }
  .hm-slot.busy { color: var(--muted); background: var(--chip); }
  .hm-slot.free { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .hm-slots .past { opacity: .45; }
  .st-info { display: flex; width: 100%; gap: 8px; align-items: baseline; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; }
  .st-info span { margin-left: auto; color: var(--accent); font-weight: 600; font-size: 13px; }
  .st-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
  .st-card .st-head { padding: 12px 14px 8px; }
  .st-card .st-head b { display: flex; justify-content: space-between; gap: 8px; }
  .st-card .st-head b small { font-weight: 600; color: var(--muted); white-space: nowrap; }
  .st-card .st-head .hint { margin: 2px 0 0; }
  .bar { height: 8px; border-radius: 999px; background: var(--chip); overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .bar.low i { background: #e0a100; }
  .st-card .row { border-top: 1px solid var(--line); }
  .st-card .row:first-child { border-top: 1px solid var(--line); }
  .st-more { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px 12px; border-top: 1px solid var(--line); }
  .st-more .chip { border: 1px dashed var(--muted); background: transparent; color: var(--muted); font-size: 13px; }
  .st-add { border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 10px 14px; width: 100%; text-align: left; border-top: 1px solid var(--line); }
  .st-qty { flex: none; font-weight: 600; font-size: 14px; text-align: right; }
  .st-qty.ok { color: var(--accent); }
  .st-qty.miss { color: var(--muted); }
  .soon { color: #c77700; font-weight: 600; }
  .gone { color: var(--danger); font-weight: 600; }
  .st-warn { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
  .st-warn:first-child { border-top: 0; }
  .st-warn .main { flex: 1; min-width: 0; }
  .st-warn button { border: 0; background: var(--chip); border-radius: 999px; padding: 6px 10px; font-size: 13px; font-weight: 600; }
  .st-batch { display: grid; grid-template-columns: 90px 1fr 28px; gap: 6px; margin-bottom: 6px; align-items: center; }
  .st-batch [data-act=st-delbatch] { border: 0; background: transparent; color: var(--danger); font-size: 20px; padding: 0; }
  .st-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .codechip { background: var(--chip); border-radius: 999px; padding: 5px 10px; font-size: 13px; border: 0; }
  .codechip::after { content: " ✕"; font-size: 11px; opacity: .7; }
  #scandlg { z-index: 100; }
  .scanbox { position: relative; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 4 / 3; }
  .scanbox video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scanbox .scanline { position: absolute; left: 12%; right: 12%; top: 50%; height: 2px; background: #ff3b30; box-shadow: 0 0 8px #ff3b30; }
  .scanbox .frame { position: absolute; left: 10%; right: 10%; top: 30%; bottom: 30%; border: 2px solid rgba(255,255,255,.8); border-radius: 10px; }
  #print-root { display: none; }
  @media print {
    @page { size: A4; margin: 16mm 15mm; }
    html, body { padding: 0 !important; margin: 0 !important; background: #fff !important; }
    body > *:not(#print-root), dialog, dialog::backdrop { display: none !important; }
    #print-root { display: block; color: #1d1d1f; font: 11pt/1.45 -apple-system, "Helvetica Neue", Arial, sans-serif; }
    #print-root * { color: #1d1d1f; }
    .pr-cover { text-align: center; padding-top: 70mm; }
    .pr-cover h1 { font-size: 30pt; margin: 0 0 6mm; }
    .pr-cover p { color: #555 !important; }
    .pr-toc { break-before: page; }
    .pr-toc h2 { font-size: 16pt; margin: 0 0 4mm; }
    .pr-toc ol { columns: 2; column-gap: 10mm; padding-left: 7mm; margin: 0; }
    .pr-toc li { margin: 0 0 1.5mm; break-inside: avoid; }
    .pr-recipe { break-before: page; }
    .pr-recipe:first-child { break-before: auto; }
    .pr-num { font-size: 9pt; color: #777 !important; text-transform: uppercase; letter-spacing: .06em; }
    .pr-recipe h1 { font-size: 22pt; margin: 1mm 0 2mm; line-height: 1.15; }
    .pr-meta { color: #555 !important; font-size: 10pt; margin-bottom: 5mm; }
    .pr-meta span + span::before { content: " · "; }
    .pr-cols { display: grid; grid-template-columns: 62mm 1fr; gap: 9mm; }
    .pr-recipe h2 { font-size: 12pt; margin: 0 0 2mm; padding-bottom: 1mm; border-bottom: 1.5px solid #2f7d4f; }
    .pr-ing { list-style: none; padding: 0; margin: 0 0 6mm; }
    .pr-ing li { padding: 1mm 0; border-bottom: 0.5px solid #ddd; break-inside: avoid; }
    .pr-ing b { display: inline-block; min-width: 17mm; font-weight: 600; }
    .pr-opt { color: #777 !important; font-size: 9pt; }
    .pr-steps { padding-left: 6mm; margin: 0; }
    .pr-steps li { margin: 0 0 2.5mm; break-inside: avoid; }
    .pr-text { white-space: pre-wrap; margin: 0; }
    .pr-src { margin-top: 6mm; font-size: 9pt; color: #555 !important; word-break: break-all; }
    .pr-note { font-size: 10pt; color: #555 !important; font-style: italic; }
  }
</style>
</head>

<div id="app"></div>
<nav class="tabs" id="tabs" hidden>
  <button data-tab="woche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Woche</button>
  <button data-tab="gerichte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 13h16a8 8 0 0 1-16 0zM12 5v3M8 6l1 2M16 6l-1 2"/></svg>Gerichte</button>

<script type="module">
// ─────────────────────────────────────────────────────────────
// KONFIGURATION – nach dem Anlegen des Supabase-Projekts ausfüllen.
// Leer lassen = lokaler Testmodus (Daten nur auf diesem Gerät).
const CONFIG = {
  SUPABASE_URL: 'https://geurcsvzxfqrzirobngz.supabase.co',

};
// ─────────────────────────────────────────────────────────────

// Test-Funktion „Alle Gerichte löschen“ in den Einstellungen – später auf false setzen
const SHOW_DELETE_ALL = true;
const APP_VERSION = '2026-11-23.4';
const SLOTS = [['mittag', 'Mittag'], ['abend', 'Abend']];
const UNITS = ['', 'g', 'kg', 'ml', 'l', 'Stk', 'EL', 'TL', 'Prise', 'Pck', 'Dose', 'Bund', 'Zehe', 'Scheibe'];
const CAT_GROUPS = [
  ['Hauptzutat', ['Fleisch', 'Geflügel', 'Fisch', 'Vegetarisch', 'Vegan']],
  ['Art', ['Pasta', 'Pizza', 'Burger', 'OnePot', 'Suppe', 'Eintopf', 'Auflauf', 'Ofengericht', 'Schmorgericht', 'Airfryer', 'Salat', 'Reis', 'Kartoffeln', 'Grillen', 'Soße', 'Beilagen', 'Snack', 'Brot/Abendbrot', 'Frühstück', 'Süßes/Dessert']],
  ['Küche', ['Deutsch', 'Italienisch', 'Amerikanisch', 'Chinesisch', 'Asiatisch', 'Mexikanisch', 'Indisch', 'Griechisch', 'Türkisch']],
  ['Praktisch', ['Schnell', 'Meal-Prep', 'Kinder-Liebling', 'Gäste']],
];
const DEFAULT_CATS = CAT_GROUPS.flatMap(g => g[1]);
const DAYNAMES = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// ── Datum-Helfer ─────────────────────────────────────────────
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay() + 6) % 7; return addDays(x, -wd); };
const weekNo = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); };
const fmtShort = d => d.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });

// ── Datenschicht ─────────────────────────────────────────────
const LocalStore = {
  mode: 'local',
  async init() { return true; },
  async session() { return true; },
  async dishes() { return ls.get('ep.dishes', []); },
  async saveDish(d) { const all = ls.get('ep.dishes', []); const i = all.findIndex(x => x.id === d.id);
    if (i >= 0) all[i] = d; else all.push(d); ls.set('ep.dishes', all); return d; },
  async deleteDish(id) { ls.set('ep.dishes', ls.get('ep.dishes', []).filter(x => x.id !== id));
    const p = ls.get('ep.plan', {}); for (const k in p) if (p[k].dish_id === id) delete p[k]; ls.set('ep.plan', p); },
  async plan(from, to) { const p = ls.get('ep.plan', {}); return Object.values(p).filter(e => e.day >= from && e.day <= to); },
  async setSlot(day, slot, dish_id, note, leftover = false, extra_ids = [], extra_texts = [], leftover_ids = []) { const p = ls.get('ep.plan', {}); const k = day + '|' + slot;
    if (!dish_id && !note) delete p[k]; else p[k] = { day, slot, dish_id: dish_id || null, note: note || '', leftover: !!(dish_id && leftover), extra_ids: dish_id ? extra_ids : [], extra_texts: dish_id ? extra_texts : [], leftover_ids: dish_id ? leftover_ids : [] }; ls.set('ep.plan', p); },
  async catalog() { return Object.values(ls.get('ep.catalog', {})); },
  async saveCatalog(entries) { const c = ls.get('ep.catalog', {}); for (const e of entries) c[e.kind + '|' + e.name_key] = e; ls.set('ep.catalog', c); },
  async deleteCatalog(kind, keys) { const c = ls.get('ep.catalog', {}); for (const k of keys) delete c[kind + '|' + k]; ls.set('ep.catalog', c); },
  async saveDishes(arr) { const all = ls.get('ep.dishes', []); const m = new Map(all.map(d => [d.id, d])); for (const d of arr) m.set(d.id, d); ls.set('ep.dishes', [...m.values()]); },
  async savePlan(arr) { const p = ls.get('ep.plan', {}); for (const e of arr) p[e.day + '|' + e.slot] = e; ls.set('ep.plan', p); },
  async deleteAll() { for (const k of ['ep.dishes', 'ep.plan', 'ep.catalog']) localStorage.removeItem(k); },
  async importRecipe() { throw new Error('Import geht nur mit der gemeinsamen Datenbank (nicht im Testmodus).'); },
  async deleteDishesAndPlan() { for (const k of ['ep.dishes', 'ep.plan']) localStorage.removeItem(k); },
  async stockItems() { return ls.get('ep.st.items', []); },
  async stockBatches() { return ls.get('ep.st.batches', []); },
  async saveStockItems(arr) { const m = new Map(ls.get('ep.st.items', []).map(x => [x.id, x])); for (const x of arr) m.set(x.id, x); ls.set('ep.st.items', [...m.values()]); },
  async deleteStockItem(id) { ls.set('ep.st.items', ls.get('ep.st.items', []).filter(x => x.id !== id)); ls.set('ep.st.batches', ls.get('ep.st.batches', []).filter(b => b.item_id !== id)); },
  async saveBatches(arr) { const m = new Map(ls.get('ep.st.batches', []).map(x => [x.id, x])); for (const x of arr) m.set(x.id, x); ls.set('ep.st.batches', [...m.values()]); },
  async deleteBatches(ids) { ls.set('ep.st.batches', ls.get('ep.st.batches', []).filter(b => !ids.includes(b.id))); },
  async getSetting(key) { return ls.get('ep.set.' + key, null); },
  async setSetting(key, value) { ls.set('ep.set.' + key, value); },
};

const SupaStore = {
  mode: 'cloud', sb: null,
  async init() {
    if (this.sb) return;
    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
    // Nur "https://xyz.supabase.co" verwenden – Pfade/Schrägstriche am Ende entfernen
    const url = new URL(CONFIG.SUPABASE_URL.trim()).origin;
    this.sb = createClient(url, CONFIG.SUPABASE_ANON_KEY.trim(), { auth: { persistSession: true, autoRefreshToken: true } });
  },
  async session() { const { data } = await this.sb.auth.getSession(); return !!data.session; },
  async login(email, password) { const { error } = await this.sb.auth.signInWithPassword({ email, password }); if (error) throw error; },
  async logout() { await this.sb.auth.signOut(); },
  // Live-Abgleich: meldet Änderungen anderer Geräte an Gerichten, Plan, Zutaten und Notvorrat
  subscribe(onChange) {
    const ch = this.sb.channel('essensplaner-live');
    for (const table of ['dishes', 'plan', 'catalog', 'stock_items', 'stock_batches', 'app_settings'])
      ch.on('postgres_changes', { event: '*', schema: 'public', table }, () => onChange(table));
    ch.subscribe(st => { state.live = st === 'SUBSCRIBED'; });
    return ch;
  },
  async importRecipe(url) {
    const { data, error } = await this.sb.functions.invoke('recipe-import', { body: { url } });
    if (error) { let msg = error.message; try { msg = (await error.context.json()).error || msg; } catch {} throw new Error(msg); }
    return data;
  },
  async dishes() { const { data, error } = await this.sb.from('dishes').select('*').order('name'); if (error) throw error; return data; },
  async saveDish(d) { const { error } = await this.sb.from('dishes').upsert(d); if (error) throw error; return d; },
  async deleteDish(id) { const { error } = await this.sb.from('dishes').delete().eq('id', id); if (error) throw error; },
  async plan(from, to) { const { data, error } = await this.sb.from('plan').select('*').gte('day', from).lte('day', to); if (error) throw error; return data; },
  async setSlot(day, slot, dish_id, note, leftover = false, extra_ids = [], extra_texts = [], leftover_ids = []) {
    const q = (!dish_id && !note)
      ? this.sb.from('plan').delete().eq('day', day).eq('slot', slot)
      : this.sb.from('plan').upsert({ day, slot, dish_id: dish_id || null, note: note || '', leftover: !!(dish_id && leftover), extra_ids: dish_id ? extra_ids : [], extra_texts: dish_id ? extra_texts : [], leftover_ids: dish_id ? leftover_ids : [] });
    const { error } = await q; if (error) throw error;
  },
  async catalog() { const { data, error } = await this.sb.from('catalog').select('*'); if (error) throw error; return data; },
  async saveCatalog(entries) { if (!entries.length) return; const { error } = await this.sb.from('catalog').upsert(entries); if (error) throw error; },
  async deleteCatalog(kind, keys) { if (!keys.length) return; const { error } = await this.sb.from('catalog').delete().eq('kind', kind).in('name_key', keys); if (error) throw error; },
  async saveDishes(arr) { for (let i = 0; i < arr.length; i += 200) { const { error } = await this.sb.from('dishes').upsert(arr.slice(i, i + 200)); if (error) throw error; } },
  async savePlan(arr) { for (let i = 0; i < arr.length; i += 500) { const { error } = await this.sb.from('plan').upsert(arr.slice(i, i + 500)); if (error) throw error; } },
  async deleteDishesAndPlan() {
    for (const [t, q] of [['plan', x => x.gte('day', '1900-01-01')], ['dishes', x => x.not('id', 'is', null)]]) {
      const { error } = await q(this.sb.from(t).delete()); if (error) throw error;
    }
  },
  async stockItems() { const { data, error } = await this.sb.from('stock_items').select('*').order('name'); if (error) throw error; return data; },
  async stockBatches() { const { data, error } = await this.sb.from('stock_batches').select('*'); if (error) throw error; return data; },
  async saveStockItems(arr) { if (!arr.length) return; const { error } = await this.sb.from('stock_items').upsert(arr); if (error) throw error; },
  async deleteStockItem(id) { const { error } = await this.sb.from('stock_items').delete().eq('id', id); if (error) throw error; },
  async saveBatches(arr) { if (!arr.length) return; const { error } = await this.sb.from('stock_batches').upsert(arr); if (error) throw error; },
  async deleteBatches(ids) { if (!ids.length) return; const { error } = await this.sb.from('stock_batches').delete().in('id', ids); if (error) throw error; },
  async getSetting(key) { const { data, error } = await this.sb.from('app_settings').select('value').eq('key', key).maybeSingle(); if (error) throw error; return data ? data.value : null; },
  async setSetting(key, value) { const { error } = await this.sb.from('app_settings').upsert({ key, value }); if (error) throw error; },
  async deleteAll() {
    for (const [t, q] of [['plan', x => x.gte('day', '1900-01-01')], ['dishes', x => x.not('id', 'is', null)], ['catalog', x => x.neq('kind', '')]]) {
      const { error } = await q(this.sb.from(t).delete()); if (error) throw error;
    }
  },
};

const store = (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY) ? SupaStore : LocalStore;

// ── Zustand ─────────────────────────────────────────────────
const state = {
  tab: ls.get('ep.tab', 'woche'),
  week: mondayOf(new Date()),
  dishes: [],
  plan: {},           // 'YYYY-MM-DD|slot' → {day, slot, dish_id, note}
  search: '',
  sort: ls.get('ep.sort', 'az'),
  cat: '',
  have: [],         // „Zu Hause“: was gerade da ist (wird nicht gespeichert)
  homeQ: '',
};
const settings = Object.assign({ shortcut: 'Einkaufsliste' }, ls.get('ep.settings', {}));

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }
async function guard(fn) { try { return await fn(); } catch (e) { console.error(e); toast('Fehler: ' + (e.message || e)); } }

function normDish(d) {
  return { ...d,
    categories: (d.categories && d.categories.length) ? d.categories : (d.category ? [d.category] : []),
    ingredients: d.ingredients || [], spices: d.spices || [],
    recipe_url: d.recipe_url || '', recipe_book: d.recipe_book || '', recipe_page: d.recipe_page || '', recipe_self: !!d.recipe_self,
    role: ['main', 'base', 'side'].includes(d.role) ? d.role : 'main', needs: d.needs || [], instructions: d.instructions || '' };
}
async function loadDishes() {
  state.dishes = (await store.dishes()).map(normDish);
  state.catalog = { zutat: new Map(), gewuerz: new Map() };
  for (const e of await store.catalog()) state.catalog[e.kind]?.set(e.name_key, e);
  // gelernte Zuordnung (Zutat oder Gewürz) aus dem gespeicherten Katalog – zuletzt gespeicherte Wahl gilt
  state.learned = new Map(); for (const kind of ['zutat', 'gewuerz']) for (const k of state.catalog[kind].keys()) state.learned.set(k, kind);
  // auch Zutaten aus vorhandenen Gerichten vorschlagen (ohne die gelernte Zuordnung zu überschreiben)
  for (const d of state.dishes) for (const [kind, arr] of [['zutat', d.ingredients], ['gewuerz', d.spices]])
    for (const i of arr) { const k = (i.name || '').trim().toLowerCase(); if (k && !state.learned.has(k) && !state.catalog[kind].has(k)) state.catalog[kind].set(k, { kind, name_key: k, name: i.name.trim(), unit: i.unit || '' }); }
}
async function loadPlan() {
  const from = iso(addDays(state.week, -3)), to = iso(addDays(state.week, 6));
  state.plan = {}; for (const e of await store.plan(from, to)) state.plan[e.day + '|' + e.slot] = normEntry(e);
}
// Reste gelten pro Gericht (leftover_ids). Ältere Einträge: „leftover“ = alle Gerichte des Platzes.
function normEntry(e) {
  const ids = [e.dish_id, ...(e.extra_ids || [])].filter(Boolean);
  let lo = (e.leftover_ids || []).filter(id => ids.includes(id));
  if (!lo.length && e.leftover && !(e.leftover_ids || []).length) lo = ids;
  return { ...e, leftover_ids: lo, leftover: lo.length > 0 };
}
const isLeftover = (e, id) => !!e && (e.leftover_ids || []).includes(id);
const dishById = id => state.dishes.find(d => d.id === id);
// alle Gerichte eines Platzes (Hauptgericht + hinzugefügte), nur existierende
const entryNames = e => [...entryDishes(e).map(x => x.name), ...((e && e.extra_texts) || [])];
const entryDishes = e => e ? [e.dish_id, ...(e.extra_ids || [])].map(dishById).filter(Boolean) : [];
async function saveEntry(e) {
  const k = e.day + '|' + e.slot;
  // fehlt das Hauptgericht, rückt das erste hinzugefügte nach
  const rank = { main: 0, base: 1, side: 2 };
  const ids = [e.dish_id, ...(e.extra_ids || [])].filter(id => id && dishById(id))
    .map((id, i) => [id, i]).sort((x, y) => (rank[dishById(x[0]).role] - rank[dishById(y[0]).role]) || x[1] - y[1]).map(x => x[0]);
  e.dish_id = ids[0] || null; e.extra_ids = [...new Set(ids.slice(1))];
  e.extra_texts = (e.extra_texts || []).filter(Boolean);
  e.leftover_ids = [...new Set((e.leftover_ids || []).filter(id => ids.includes(id)))];
  e.leftover = e.leftover_ids.length > 0;
  if (!e.dish_id) { e.leftover = false; e.leftover_ids = []; e.extra_ids = []; e.extra_texts = []; }
  await guard(() => store.setSlot(e.day, e.slot, e.dish_id, e.note || '', e.leftover, e.extra_ids, e.extra_texts, e.leftover_ids));
  if (e.dish_id || e.note) state.plan[k] = e; else delete state.plan[k];
}
const categories = () => [...new Set(state.dishes.flatMap(d => d.categories).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'de'));

// ── Rendering ───────────────────────────────────────────────
function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  const app = $('#app');
  if (state.tab === 'woche') app.innerHTML = viewWeek();
  else if (state.tab === 'gerichte') app.innerHTML = viewDishes();
  else if (state.tab === 'vorrat') app.innerHTML = viewHome();
  else if (state.tab === 'notvorrat') app.innerHTML = viewStock();
  else app.innerHTML = viewShopping();
}

function weekNav() {
  const end = addDays(state.week, 6);
  const isNow = iso(state.week) === iso(mondayOf(new Date()));
  return `<div class="weeknav">
    <button data-act="prevweek" aria-label="Vorherige Woche">‹</button>
    <div class="label" data-act="thisweek"><b>KW ${weekNo(state.week)}${isNow ? ' · diese Woche' : ''}</b><span>${fmtShort(state.week)} – ${fmtShort(end)}</span></div>
    <button data-act="nextweek" aria-label="Nächste Woche">›</button></div>`;
}

function viewWeek() {
  const today = iso(new Date());
  let html = `<div class="wrap"><header class="top"><h1>Wochenplan</h1>
    <button class="iconbtn" data-act="settings" aria-label="Einstellungen">⚙︎</button></header>`;
  if (store.mode === 'local') html += `<div class="banner">Testmodus: Daten werden nur auf diesem Gerät gespeichert.</div>`;
  html += weekNav();
  for (let i = 0; i < 7; i++) {
    const d = addDays(state.week, i), key = iso(d);
    html += `<section class="day${key === today ? ' today' : ''}"><h3>${DAYNAMES[i]} · ${fmtShort(d)}</h3>`;
    for (const [slot, label] of SLOTS) {
      const e = state.plan[key + '|' + slot]; const all = entryDishes(e); const dish = all[0];
      let what;
      const loNames = all.filter(x => isLeftover(e, x.id)).map(x => esc(x.name));
      const newNames = [...all.filter(x => !isLeftover(e, x.id)).map(x => esc(x.name)), ...(e?.extra_texts || []).map(esc)];
      const plus = ' <span class="plus">+</span> ';
      const loGroup = loNames.length ? `<span class="leftover-group"><span class="leftover">🍱 Reste</span> ${loNames.join(plus)}</span>` : '';
      if (dish) what = `<span class="what">${[loGroup, newNames.join(plus)].filter(Boolean).join(plus)}${dish.categories.length && !e.leftover ? `<div class="cat">${esc(dish.categories.join(', '))}</div>` : ''}${e.note ? `<div class="cat note">📝 ${esc(e.note)}</div>` : ''}</span>`;
      else if (e && e.note) what = `<span class="what note">${esc(e.note)}</span>`;
      else what = `<span class="what empty">+ Gericht wählen</span>`;
      html += `<button class="slot" data-act="pick" data-day="${key}" data-slot="${slot}"><span class="when">${label}</span>${what}</button>`;
    }
    html += `</section>`;
  }
  return html + `</div>`;
}

function filteredDishes() {
  const q = state.search.trim().toLowerCase();
  return state.dishes
    .filter(d => !state.cat || d.categories.includes(state.cat))
    .filter(d => !q || d.name.toLowerCase().includes(q) || [...d.ingredients, ...d.spices].some(i => (i.name || '').toLowerCase().includes(q)))
    .sort(state.sort === 'new'
      ? (a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')) || a.name.localeCompare(b.name, 'de')
      : (a, b) => a.name.localeCompare(b.name, 'de'));
}
// „hinzugefügt heute / gestern / vor 3 Tagen / 12.11.“
function addedLabel(ts) {
  if (!ts) return '';
  const d = new Date(ts); if (isNaN(d)) return '';
  const days = Math.round((parseISO(iso(new Date())) - parseISO(iso(d))) / 864e5);
  return days <= 0 ? 'heute' : days === 1 ? 'gestern' : days < 7 ? `vor ${days} Tagen` : d.toLocaleDateString('de-DE', { day: 'numeric', month: 'numeric', year: days > 300 ? '2-digit' : undefined });
}
function viewDishes() {
  const cats = categories();
  const list = filteredDishes();
  let html = `<div class="wrap"><header class="top"><h1>Gerichte</h1><div style="display:flex;gap:8px"><button class="iconbtn" data-act="importlink" aria-label="Aus Link importieren">🔗 Import</button><button class="iconbtn primary" data-act="newdish">+ Neu</button></div></header>
    <input class="search" id="search" type="search" placeholder="Suchen (Name oder Zutat)" value="${esc(state.search)}">`;
  html += `<div class="seg" style="margin-bottom:10px">${[['az', 'A–Z'], ['new', 'Zuletzt hinzugefügt']].map(([k, t]) => `<button class="${(state.sort || 'az') === k ? 'on' : ''}" data-act="sortdishes" data-sort="${k}">${t}</button>`).join('')}</div>`;
  if (cats.length) html += `<div class="chips"><button class="chip${!state.cat ? ' on' : ''}" data-act="cat" data-cat="">Alle</button>${groupedCats(cats).flatMap(([, cs]) => cs).map(c => `<button class="chip${state.cat === c ? ' on' : ''}" data-act="cat" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
  if (!state.dishes.length) return html + `<div class="empty-state">Noch keine Gerichte.<br>Tippe auf „+ Neu“.</div></div>`;

  const why = d => {

    ${q ? why(d) : `<div class="sub">${esc([state.sort === 'new' && addedLabel(d.created_at) ? '＋ ' + addedLabel(d.created_at) : '', d.categories.join(', '), d.ingredients.map(i => i.name).filter(Boolean).join(', ')].filter(Boolean).join(' · ')) || '&nbsp;'}</div>`}</div>${(d.recipe_self || d.recipe_url || d.recipe_book) ? '<span title="Rezept vorhanden">📖</span>' : ''}</button>`).join('') + `</div>`;

  return html + `<p class="hint">${state.dishes.length} Gerichte${filtered ? ' · der PDF-Export nimmt die aktuelle Suche/Kategorie' : ''}</p></div>`;
}

// ── „Zu Hause“: Was kann ich mit dem kochen, was da ist? ─────
// Vergleich über Wortstämme: „Zwiebel“ passt zu „Zwiebeln“, „rote Zwiebel“, „Zwiebel, groß“, „Gemüsezwiebel“.
const HM_SKIP = new Set(['groß', 'große', 'großer', 'klein', 'kleine', 'kleiner', 'frisch', 'frische', 'frischer', 'tk', 'gefroren']);
const hmStem = w => w.replace(/(en|n|e|s)$/, '');
const hmWords = s => String(s || '').toLowerCase().split(',')[0].replace(/[()]/g, ' ').split(/\s+/).filter(w => w && !HM_SKIP.has(w)).map(hmStem).filter(w => w.length > 1);
const hmLabel = s => { const w = String(s || '').split(',')[0].trim().split(/\s+/).filter(x => !HM_SKIP.has(x.toLowerCase())).join(' '); return w ? w[0].toUpperCase() + w.slice(1) : ''; };
function hmHas(ingName, have) {
  // „Sahne oder Kokosmilch“ → eine Alternative reicht
  return String(ingName).split(/\s+oder\s+/i).some(alt => {
    const iw = hmWords(alt); if (!iw.length) return false;
    return have.some(h => { const hw = hmWords(h); return hw.length && hw.every(x => iw.some(w => w === x || (x.length >= 4 && (w.endsWith(x) || x.endsWith(w) && w.length >= 4)))); });
  });
}
function homeIngredients() {
  const map = new Map();
  for (const d of state.dishes) for (const i of d.ingredients) {
    const label = hmLabel(i.name); if (!label) continue;
    const k = hmWords(label).join(' '); const e = map.get(k) || { label, n: 0 }; e.n++; map.set(k, e);
  }
  return [...map.values()].sort((a, b) => b.n - a.n || a.label.localeCompare(b.label, 'de'));
}
function homeResults() {
  const have = state.have;
  return state.dishes.map(d => {
    const ings = d.ingredients.filter(i => i.name);
    const req = ings.filter(i => !i.optional), opt = ings.filter(i => i.optional);
    const got = req.filter(i => hmHas(i.name, have)), miss = req.filter(i => !hmHas(i.name, have));
    const optGot = opt.filter(i => hmHas(i.name, have));
    return { d, req, got, miss, opt, optGot };
  }).filter(r => r.got.length || r.optGot.length)
    .sort((a, b) => a.miss.length - b.miss.length || (b.got.length / (b.req.length || 1)) - (a.got.length / (a.req.length || 1)) || b.got.length - a.got.length);
}
function viewHome() {
  const q = state.homeQ.trim().toLowerCase();
  const selKeys = new Set(state.have.map(h => hmWords(h).join(' ')));
  const all = homeIngredients().filter(x => !selKeys.has(hmWords(x.label).join(' ')));
  const shown = q ? all.filter(x => x.label.toLowerCase().includes(q)) : all.slice(0, 24);
  let html = `<div class="wrap"><header class="top"><h1>Zu Hause</h1>${state.have.length ? '<button class="iconbtn" data-act="home-clear">Leeren</button>' : ''}</header>
    <input class="search" id="home-search" type="search" enterkeyhint="done" autocomplete="off" placeholder="Zutat suchen oder eingeben …" value="${esc(state.homeQ)}">`;
  if (state.have.length) html += `<div class="hm-sel">${state.have.map((h, i) => `<button class="chip on" data-act="home-del" data-i="${i}">${esc(h)}</button>`).join('')}</div>`;
  html += `<div class="hm-pick">${shown.map(x => `<button class="chip" data-act="home-add" data-v="${esc(x.label)}">${esc(x.label)}</button>`).join('')}
    ${q && !all.some(x => x.label.toLowerCase() === q) ? `<button class="chip" data-act="home-add" data-v="${esc(state.homeQ.trim())}">+ „${esc(state.homeQ.trim())}“</button>` : ''}</div>`;
  if (!q && all.length > shown.length) html += `<p class="hint" style="margin-top:0">Häufigste Zutaten – tippe zum Suchen, um weitere zu finden.</p>`;
  if (!state.have.length) return html + `<div class="empty-state">Tippe an, was du zu Hause hast.<br>Gewürze und Vorrat zählen automatisch als vorhanden.</div></div>`;
  const res = homeResults();
  if (!res.length) return html + `<div class="empty-state">Kein Gericht passt zu diesen Zutaten.</div></div>`;
  const card = r => `<div class="hm-card"><div class="hm-head"><b data-act="editdish" data-id="${r.d.id}">${esc(r.d.name)}</b></div>
    <div class="hm-meta">${r.miss.length ? `${r.got.length} von ${r.req.length} Zutaten da` : 'Alles da'}${r.optGot.length ? ` · +${r.optGot.length} optional` : ''}</div>
    <div class="hm-foot"><div class="hm-chips">${r.got.map(i => `<span class="hm-chip">${esc(i.name)}</span>`).join('')}${r.optGot.map(i => `<span class="hm-chip opt">${esc(i.name)}</span>`).join('')}${r.miss.map(i => `<span class="hm-chip miss">fehlt: ${esc(i.name)}</span>`).join('')}</div>
    <button class="hm-add" data-act="home-plan" data-id="${r.d.id}">+ Plan</button></div></div>`;
  const groups = [['Alles da', r => !r.miss.length], ['Fehlt 1 Zutat', r => r.miss.length === 1], ['Fehlt 2 Zutaten', r => r.miss.length === 2]];
  for (const [t, f] of groups) { const l = res.filter(f); if (l.length) html += `<div class="group-title">${t} (${l.length})</div>` + l.map(card).join(''); }
  const rest = res.filter(r => r.miss.length > 2);
  if (rest.length) html += `<details><summary>Fehlen mehr Zutaten (${rest.length})</summary>${rest.map(card).join('')}</details>`;
  return html + `</div>`;
}
function homeAdd(v) {
  v = String(v || '').trim(); if (!v) return;
  const k = hmWords(v).join(' ');
  if (!state.have.some(h => hmWords(h).join(' ') === k)) state.have.push(hmLabel(v) || v);

  const s = $('#home-search'); if (s && matchMedia('(pointer:fine)').matches) s.focus();

// Platz im Wochenplan wählen (aktuell angezeigte Woche)

// Einkaufsliste aus dem Wochenplan zusammenrechnen
function parseAmount(a) { if (a == null || a === '') return null; const n = Number(String(a).replace(',', '.').trim()); return isFinite(n) ? n : NaN; }
function fmtNum(n) { return Number.isInteger(n) ? String(n) : n.toLocaleString('de-DE', { maximumFractionDigits: 2 }); }
function shoppingItems(field = 'ingredients') {
  // field: 'ingredients' (Pflicht-Zutaten), 'optional' (optionale Zutaten), 'spices'
  const map = new Map();
  const wFrom = iso(state.week), wTo = iso(addDays(state.week, 6));
  for (const e of Object.values(state.plan)) {
    if (e.day < wFrom || e.day > wTo) continue;
    for (const dish of entryDishes(e)) {
    if (isLeftover(e, dish.id)) continue;
    const src = field === 'spices' ? dish.spices : dish.ingredients.filter(i => field === 'optional' ? i.optional : !i.optional);
    for (const ing of src) {
      const name = (ing.name || '').trim(); if (!name) continue;
      const unit = ing.unit || ''; const key = name.toLowerCase() + '|' + unit;
      let it = map.get(key); if (!it) { it = { key, name, unit, sum: 0, hasNum: false, extra: [], dishes: new Set() }; map.set(key, it); }
      const n = parseAmount(ing.amount);
      if (n === null) {} else if (isNaN(n)) it.extra.push(ing.amount); else { it.sum += n; it.hasNum = true; }
      it.dishes.add(dish.name);
    }
    }
  }
  const extras = field === 'ingredients' ? ls.get('ep.extra.' + iso(state.week), []) : [];
  for (const x of extras) map.set('extra|' + x, { key: 'extra|' + x, name: x, unit: '', sum: 0, hasNum: false, extra: [], dishes: new Set(), isExtra: true });
  return [...map.values()].sort((a, b) => a.name.localeCompare(b.name, 'de'));
}
function itemText(it) {
  const parts = [];
  let sum = it.sum, unit = it.unit;
  if (unit === 'g' && sum >= 1000) { sum /= 1000; unit = 'kg'; }
  if (unit === 'ml' && sum >= 1000) { sum /= 1000; unit = 'l'; }
  if (it.hasNum) parts.push(fmtNum(sum) + (unit ? ' ' + unit : ''));
  else if (it.unit && !it.extra.length) parts.push(it.unit);
  if (it.extra.length) parts.push(it.extra.join(' + ') + (it.unit && !it.hasNum ? ' ' + it.unit : ''));
  return parts.length ? `${it.name} (${parts.join(' + ')})` : it.name;
}

function viewShopping() {

  return html + `</div>`;
}

// ── Dialoge ────────────────────────────────────────────────
const dlg = $('#dlg');
function openSheet(html) { dlg.innerHTML = html; if (!dlg.open) dlg.showModal(); }
function closeSheet() { dlg.close(); }

const picker = { cat: null, q: '', random: null };
const NOCAT = 'Ohne Kategorie';
// vorhandene Kategorien in derselben Gruppierung/Reihenfolge wie im Gericht-Formular
function groupedCats(available) {
  const av = new Set(available);
  const groups = CAT_GROUPS.map(([g, cs]) => [g, cs.filter(c => av.has(c))]);
  const own = [...av].filter(c => !DEFAULT_CATS.includes(c) && c !== NOCAT).sort((a, b) => a.localeCompare(b, 'de'));
  groups.push(['Eigene', own]);
  if (av.has(NOCAT)) groups.push(['Sonstiges', [NOCAT]]);
  return groups.filter(([, cs]) => cs.length);
}
function pickerCats() {
  const cats = categories();
  if (state.dishes.some(d => !d.categories.length)) cats.push(NOCAT);
  return cats;
}
function randomLabel() {
  if (picker.cat === null && picker.need?.kind === 'side' && picker.matches?.length) return '🎲 Zufällig aus passenden Grundrezepten';
  return picker.cat && picker.cat !== '*' ? `🎲 Zufällig aus „${esc(picker.cat)}“` : '🎲 Zufallsgericht';
}
// Zufall ohne Kategorie: keine reinen Ergänzungen (Soßen, Beilagen …), außer beim Ergänzen
// Fehlt in einer Mahlzeit noch etwas? (Gericht, das eine Ergänzung braucht, oder nur Ergänzungen)
function missingNeed(e) {
  const ds = entryDishes(e); const hasText = ((e && e.extra_texts) || []).length > 0;
  if (!ds.length || hasText) return null;
  for (const b of ds.filter(x => x.role === 'base' && x.needs.length)) {
    if (!ds.some(o => o !== b && o.categories.some(c => b.needs.includes(c)))) return { kind: 'base', dish: b };
  }
  if (ds.every(x => x.role === 'side')) return { kind: 'side', dish: ds[0] };
  return null;
}
// nach dem Wählen: fehlt noch etwas -> weiter fragen, sonst Detail bzw. schließen
function afterChoose(day, slot, fromDetail) {
  render();
  if (missingNeed(state.plan[day + '|' + slot])) return openSheet(pickerHtml(day, slot, true));
  return fromDetail ? openSheet(slotDetailHtml(day, slot)) : closeSheet();
}
// Grundrezepte, die zu den gewählten Ergänzungen passen (z. B. Nudeln „braucht Soße“ ↔ Tomatensoße „Soße“)
function matchingBases(e) {
  const cats = new Set(entryDishes(e).filter(x => x.role === 'side').flatMap(x => x.categories));
  return state.dishes.filter(d => d.role === 'base' && d.needs.some(n => cats.has(n)));
}
function randomPool() {
  const pool = pickerPool();
  if (picker.cat === null && picker.need?.kind === 'side' && picker.matches?.length) return picker.matches;
  if ((picker.cat === null || picker.cat === '*') && (!picker.add || picker.need?.kind === 'side')) return pool.filter(d => d.role !== 'side');
  return pool;
}
function pickerPool() {

  return state.dishes.filter(d => picker.cat === NOCAT ? !d.categories.length : d.categories.includes(picker.cat));
}

function dishBlockHtml(x, removable, lo = null) {

// zuletzt gekochtes Gericht vor diesem Platz (max. 3 Tage zurück).
// Jedes Original darf nur einmal als Reste verwendet werden.
function slotPos(day, slot) { return Math.round(parseISO(day) / 864e5) * SLOTS.length + SLOTS.findIndex(x => x[0] === slot); }
function availableLeftovers(day, slot) {
  const order = SLOTS.map(x => x[0]); const target = slotPos(day, slot);
  const entries = Object.values(state.plan); const found = [];
  let d = parseISO(day), i = order.indexOf(slot);
  for (let step = 0; step < 3 * order.length; step++) {
    i--; if (i < 0) { i = order.length - 1; d = addDays(d, -1); }
    const e = state.plan[iso(d) + '|' + order[i]]; const dish = e && entryDishes(e).find(x => !isLeftover(e, x.id));
    if (!dish) continue;
    const orig = slotPos(e.day, e.slot);
    const used = entries.some(x => isLeftover(x, dish.id) && slotPos(x.day, x.slot) > orig
      && slotPos(x.day, x.slot) !== target && slotPos(x.day, x.slot) <= orig + 3 * order.length);
    if (used || found.some(f => f.dish.id === dish.id)) continue;
    const diff = Math.round((parseISO(day) - d) / 864e5);
    const when = diff === 0 ? 'heute' : diff === 1 ? 'gestern' : DAYNAMES[(d.getDay() + 6) % 7];
    found.push({ dish, src: e.day + '|' + e.slot, names: entryNames(e).join(' + '), label: `${when} ${SLOTS[i][1]}` });
  }
  return found;
}

// ── Rezept-Import aus dem Internet ─────────────────────────
const UNIT_MAP = {
  'g': 'g', 'gr': 'g', 'gr.': 'g', 'gramm': 'g', 'kg': 'kg', 'kilo': 'kg', 'kilogramm': 'kg',
  'ml': 'ml', 'milliliter': 'ml', 'l': 'l', 'liter': 'l', 'cl': 'cl',
  'el': 'EL', 'el.': 'EL', 'esslöffel': 'EL', 'essl.': 'EL', 'tl': 'TL', 'tl.': 'TL', 'teelöffel': 'TL',
  'prise': 'Prise', 'prisen': 'Prise', 'pck': 'Pck', 'pck.': 'Pck', 'päckchen': 'Pck', 'packung': 'Pck', 'packungen': 'Pck', 'pkt.': 'Pck', 'pkt': 'Pck',
  'dose': 'Dose', 'dosen': 'Dose', 'bund': 'Bund', 'zehe': 'Zehe', 'zehen': 'Zehe', 'scheibe': 'Scheibe', 'scheiben': 'Scheibe',
  'stk': 'Stk', 'stk.': 'Stk', 'stück': 'Stk',
};
const OTHER_UNITS = ['becher', 'glas', 'gläser', 'tasse', 'tassen', 'msp', 'msp.', 'messerspitze', 'handvoll', 'schuss', 'spritzer', 'kopf', 'köpfe', 'stange', 'stangen', 'zweig', 'zweige', 'blatt', 'blätter', 'würfel', 'tüte', 'tüten', 'beutel', 'flasche', 'knolle', 'knollen', 'stiel', 'stiele', 'tropfen', 'tube'];
// typische Vorratsartikel → Gewürze/Vorrat (siehe Erfassungsregeln)
const PANTRY_RE = /^(salz|meersalz|pfeffer|.*pfeffer$|.*salz$|.*öl$|öl|.*essig|essig|zucker|puderzucker|brauner zucker|mehl|weizenmehl|butter|.*brühe|brühe|.*bouillon|sojasoße|sojasauce|.*senf|senf|tomatenmark|.*pulver|.*gewürz|gewürz.*|paprika edelsüß|paprika rosenscharf|curry|oregano|thymian|rosmarin|majoran|kreuzkümmel|kümmel|zimt|muskat|muskatnuss|chiliflocken|cayennepfeffer|lorbeerblatt|lorbeerblätter|lorbeer|backpulver|natron|speisestärke|stärke|maisstärke|soßenbinder|saucenbinder|honig|zitronensaft|weißwein|rotwein|vanillezucker|kurkuma|ingwerpulver|italienische kräuter|kräuter der provence|.*kräuter, getrocknet|crema di balsamico|worcestershiresauce)$/i;
const WATER_RE = /^(wasser|warmes wasser|kaltes wasser|heißes wasser|lauwarmes wasser|leitungswasser)$/i;

// Handelsmarken am Anfang des Zutatennamens („REWE Beste Wahl Toastbrot“ → „Toastbrot“)
const BRAND_RE = /^\s*(rewe\s+beste\s+wahl|rewe\s+bio|rewe\s+feine\s+welt|rewe\s+regional|rewe\s+frei\s+von|rewe|ja!|gut\s*&\s*günstig|k-classic|milbona|edeka|bio)\s+/i;
function numFromText(t) {
  const fr = { '½': '.5', '¼': '.25', '¾': '.75', '⅓': '.33', '⅔': '.67', '⅛': '.125' };
  t = t.replace(/(\d)?\s*([½¼¾⅓⅔⅛])/g, (_, d, f) => (d || '0') + fr[f]);
  const m = t.match(/^(\d+)\s*\/\s*(\d+)$/); if (m) return String(+(m[1] / m[2]).toFixed(2)).replace('.', ',');
  return t.replace('.', ',');
}
function canonicalName(name, kind) {
  const cat = state.catalog?.[kind]; const k = name.toLowerCase();
  for (const c of [k, k.replace(/n$/, ''), k.replace(/en$/, ''), k.replace(/e$/, ''), k.replace(/s$/, '')]) {
    if (cat?.has(c)) return cat.get(c).name;
  }
  return name;
}
function parseRecipeLine(line) {
  let t = line.replace(/\s+/g, ' ').trim();
  let optional = false;
  t = t.replace(/\s*\((optional|nach belieben|n\. ?b\.)\)\s*/gi, () => { optional = true; return ' '; }).trim();
  t = t.replace(/^(optional|opt\.|nach belieben|wer mag|wer möchte)\s*:?\s*/i, () => { optional = true; return ''; }).trim();
  t = t.replace(/\s*\((zum|zur|für|z\.\s?b\.|ca\.|am stück|oder|o\.\s?ä\.|alternativ|je nach)[^)]*\)/gi, '').trim();
  if (/\b(nach belieben|evtl\.|eventuell|optional)\b/i.test(t)) { optional = true; t = t.replace(/,?\s*\b(nach belieben|evtl\.|eventuell|optional)\b/gi, '').trim(); }
  t = t.replace(/^(ca\.|circa|etwa|etwas|einige|ein paar|wenig|reichlich)(?=\s|$)\s*/i, '');
  const m = t.match(/^([\d.,/½¼¾⅓⅔⅛]+(?:\s*[-–]\s*[\d.,/½¼¾⅓⅔⅛]+)?)\s*([^\s\d]+)?\s*(.*)$/);
  let amount = '', unit = '', name = t;
  if (m) {
    amount = m[1].includes('-') || m[1].includes('–') ? m[1].replace(/\s/g, '') : numFromText(m[1].replace(/\s/g, ''));
    let w = (m[2] || ''), rest = m[3] || '';
    const lw = w.toLowerCase().replace(/\((n|s|e|en|er)\)$/, '');
    if (UNIT_MAP[lw] && rest) { unit = UNIT_MAP[lw]; name = rest; }
    else if (OTHER_UNITS.includes(lw) && rest) { unit = 'Stk'; name = `${rest} (${w.replace(/\.$/, '')})`; }
    else { name = [w, rest].filter(Boolean).join(' '); }
    if (unit === 'cl') { amount = String(+(parseFloat(amount.replace(',', '.')) * 10) || amount).replace('.', ','); unit = 'ml'; }
  }
  // „500g“ zusammengeschrieben
  const g = amount === '' && t.match(/^(\d+(?:[.,]\d+)?)(g|kg|ml|l)\s+(.*)$/i);
  if (g) { amount = g[1].replace('.', ','); unit = UNIT_MAP[g[2].toLowerCase()]; name = g[3]; }
  name = name.replace(/\(n\)|\(s\)|\(e\)|\(en\)|\(er\)/g, '').replace(/\s*,.*$/, '').replace(BRAND_RE, '').replace(BRAND_RE, '').replace(/\s+/g, ' ').trim();
  return { amount, unit, name, optional };
}
function recipeToDish(r) {
  const ingredients = [], spices = [];

      const learned = state.learned?.get(i.name.toLowerCase()) || state.learned?.get(canonicalName(i.name, 'gewuerz').toLowerCase())
        || state.learned?.get(canonicalName(i.name, 'zutat').toLowerCase());
      const asSpice = learned ? learned === 'gewuerz' : (state.catalog?.gewuerz?.has(i.name.toLowerCase()) || PANTRY_RE.test(i.name));
      const kind = asSpice ? 'gewuerz' : 'zutat';
      i.name = canonicalName(i.name, kind);

}

// eingefügten Rezepttext in Name, Zutaten und Schritte zerlegen
const AMOUNT_ONLY_RE = /^(ca\.\s*)?[\d.,/½¼¾⅓⅔⅛]+(\s*[-–]\s*[\d.,/½¼¾⅓⅔⅛]+)?\s*([a-zäöüß.]{1,12})?(\((?:n|s|e|en|er)\))?$/i;
// nur Menge (+ Einheit) ohne Zutat, z. B. „500 g“ oder „2“ – Zutat folgt in der nächsten Zeile
const isAmountOnly = l => { const m = l.match(AMOUNT_ONLY_RE); if (!m) return false; const u = (m[3] || '').toLowerCase(); return !u || !!UNIT_MAP[u] || OTHER_UNITS.includes(u) || /^(stück|stk\.?)$/.test(u); };
function parsePastedRecipe(text) {
  const lines = String(text || '').replace(/\r/g, '').replace(/[\u200b-\u200f\u2060\ufeff]/g, '').split('\n')
    .map(l => l.replace(/[\u00a0\u202f\t]+/g, ' ')
      .replace(/^(\d)\uFE0F?\u20E3\s*/u, '$1. ')                                   // 1️⃣ → „1. “
      .replace(/^(?:[\p{Extended_Pictographic}\p{So}\uFE0F\u200D•·▪*\-–→>]+\s*)+/u, '')   // ✳️ ✅ ▪️ 👉 • - als Aufzählung
      .replace(/(\s+[#@][\p{L}\p{N}_äöüß]+)+\s*$/u, '')                             // Hashtags/Erwähnungen am Zeilenende
      .replace(/\s+/g, ' ').trim());
  const isIngHead = l => /^(zutaten|einkaufsliste|du brauchst|das brauchst du)\b[^a-zäöüß]*(für.*)?:?$/i.test(l);
  const isStepHead = l => /^(zubereitung|anleitung|so geht'?s|so wird'?s gemacht|schritte|zubereitungsschritte|arbeitsschritte|und so geht'?s)\b.*:?$/i.test(l) && l.length < 40;
  const isToolHead = l => /^(utensilien|küchenutensilien|küchengeräte|das brauchst du an utensilien|benötigte utensilien|equipment|werkzeuge?)\s*:?$/i.test(l);
  // Seitentext von Shop-/Rezeptseiten, der keine Zutat ist
  const isNoise = l => /^(zutaten online bestellen|online bestellen|alle zutaten (in den )?warenkorb.*|in den warenkorb|zum warenkorb|zur einkaufsliste( hinzufügen)?|auf die einkaufsliste|einkaufsliste|was hast du noch da\??|das hast du (bestimmt )?(noch )?(zu ?hause|da)\??|im markt verfügbar|nicht im sortiment|jetzt bestellen|lieferservice|abholservice|produkt auswählen|ersetzen|merken|drucken|teilen|bewerten|rezept speichern)$/i.test(l)
    || /^(portionen?|personen|menge|anzahl)\s*[-+]?\s*\d*\s*[-+]?$/i.test(l) || /^[-+]$/.test(l);
  // ab hier gehört nichts mehr zum Rezept (Hinweise, Nährwerte, Empfehlungen) – bis zur nächsten Überschrift
  const isStopHead = l => /^(wir zeigen dir.*|zum rezeptfinder|rezeptfinder|ernährwert.*|nährwert.*|weitere rezepte.*|ähnliche rezepte.*|passende rezepte.*|das könnte dir (auch )?gefallen.*|mehr rezepte.*|tipps?( (&|und) tricks)?|kommentare.*|\d* ?bewertungen.*|produkte zum rezept.*|newsletter.*)$/i.test(l);
  // Beschriftungen von Symbolen/Knöpfen
  // Social-Media-Zeilen ohne Rezeptinhalt: „Anzeige“, „Teil 29 | …“, reine Hashtag-Zeilen, „Link in Bio“
  const isSocial = l => /^(\*?(anzeige|werbung|unbezahlte werbung|unbeauftragte werbung|ad|sponsored)\b|(teil|folge|part|episode)\s*\d+\b|link (in|im) (der )?bio|speicher(e|t)? (dir )?(das|dieses) rezept|folg(e|t) (mir|uns)|rezept (zum|als) (nachkochen|speichern))/i.test(l)
    || /^([#@][\p{L}\p{N}_äöüß]+\s*)+$/u.test(l);
  const isUiLabel = l => /^(arrow[ -]?(right|left|up|down)|chevron.*|icon.*|pfeil.*|play|pause|close|schließen|menü|menu|mehr anzeigen|weniger anzeigen|alle anzeigen|zurück|weiter|info|i)$/i.test(l);
  const tools = new Set();
  const ingKeys = new Set();   // Zutatenzeilen (komplett und ohne Menge), um Wiederholungen in den Schritten zu erkennen
  const addIngKey = x => { const k = x.toLowerCase().trim(); ingKeys.add(k); ingKeys.add(k.replace(/^[\d.,/½¼¾⅓⅔⅛]+\s*/, '')); };
  // Shop-Layout (z. B. REWE): Utensilien-Liste oder Zutatenzeilen mit „•“ über den Schritten
  const shopLayout = lines.some(l => isToolHead(l) || l.includes('•'));

  let name = '', yld = '', ing = [], steps = [], sec = 'pre';
  const nonEmpty = lines.filter(Boolean);
  const hasHeads = nonEmpty.some(isIngHead);
  for (let i = 0; i < nonEmpty.length; i++) {

    if (isStepHead(l)) { sec = 'steps'; continue; }
    if (isUiLabel(l) || isSocial(l)) continue;
    if (isStopHead(l)) { sec = 'skip'; continue; }
    if (isToolHead(l)) { sec = 'tools'; continue; }
    if (sec === 'skip') continue;
    if (sec === 'tools' && !isNoise(l)) { if (l.length < 40 && !/[.!?]$/.test(l)) { tools.add(l.toLowerCase()); continue; } sec = 'steps'; }
    if (isNoise(l)) {

      // „Portionen“ gefolgt von einer reinen Zahl: Zahl ist die Portionsangabe
      if (/^(portionen?|personen)/i.test(l) && /^\d+$/.test(nonEmpty[i + 1] || '')) { if (!yld) yld = `${nonEmpty[i + 1]} Portionen`; i++; }

    }
    if (sec === 'ing') {

      else {

        l = l.replace(/^\d+[.)]\s+(?=[\d½¼¾⅓⅔⅛a-zäöüß])/i, '');        // Listennummer „1. 250 g …“
        if (/^(portionen?|personen|menge|anzahl)$/i.test(l)) continue;
        if (isAmountOnly(l) && nonEmpty[i + 1] && !isStepHead(nonEmpty[i + 1]) && !isNoise(nonEmpty[i + 1]) && !isToolHead(nonEmpty[i + 1])) { l = l + ' ' + nonEmpty[++i]; }  // „500 g“ / „Nudeln“ in zwei Zeilen
        if (l.includes('•')) { l.split(/\s*•\s*/).filter(Boolean).forEach(x => { ing.push(x); addIngKey(x); }); continue; }
        ing.push(l); addIngKey(l); continue;
      }
    }
    if (sec === 'steps') {
      if (/^(schritt\s*)?\d+[.)]?$/i.test(l)) continue;             // nur „Schritt 1“ / „1.“
      if (l.includes('•')) continue;                                 // Zutaten-Zeile über dem Schritt („0,5 Bio Orange • 100 g Mayonnaise“)
      if (tools.has(l.toLowerCase())) continue;                      // Utensil („Zestenreibe“)
      if (/^(utensilien|zutaten)\s*:/i.test(l)) continue;
      // kurze Zeile ohne Satzzeichen und ohne Verb-Anschein = Utensil/Überschrift, kein Arbeitsschritt
      if (shopLayout && l.split(' ').length <= 3 && l.length < 30 && !/[.!?:]/.test(l) && !/\d/.test(l)) continue;
      // Zutat, die schon in der Zutatenliste steht („100 g Mayonnaise“, „Salz“)
      const key = l.toLowerCase();
      if (ingKeys.has(key) || ingKeys.has(key.replace(/^[\d.,/½¼¾⅓⅔⅛]+\s*/, ''))) continue;
      if (shopLayout && !/[.!?]/.test(l) && l.length < 60) {
        // Zutatenzeile über dem Schritt: beginnt mit Menge, kein Satz („0,5 Bio Orange“, „2 REWE Beste Wahl Chef-Tomaten“)
        if (/^[\d½¼¾⅓⅔⅛]/.test(l)) continue;
        // Utensilien als Kommaliste („Zestenreibe, Bratenthermometer, Holzspieße“)
        if (l.includes(',') && l.split(',').every(x => x.trim().split(' ').length <= 3)) { l.split(',').forEach(x => tools.add(x.trim().toLowerCase())); continue; }
      }
      const st = l.replace(/^(schritt\s*)?\d+[.):]\s*/i, '').trim();

}
function doImportText() {
  const text = $('#import-paste').value, st = $('#import-status');
  if (!text.trim()) return toast('Bitte zuerst den Rezepttext einfügen');
  const r = parsePastedRecipe(text);
  if (!r.ingredients.length && !r.steps.length) { if (st) st.innerHTML = '<span style="color:var(--danger)">Im Text wurden keine Zutaten erkannt. Steht eine Überschrift „Zutaten“ darüber?</span>'; return; }

  const d = recipeToDish({ ...r, url });
  d._import.host = d._import.host || 'eingefügtem Text';
  openSheet(dishFormHtml(d, true));
}
async function doImport(url) {
  url = (url || '').trim(); const m = url.match(/https?:\/\/\S+/); if (m) url = m[0];
  if (!url) return toast('Bitte einen Link einfügen');
  const st = $('#import-status'); if (st) st.textContent = 'Lade Rezept …';
  const btn = dlg.querySelector('[data-act=doimport]'); if (btn) btn.disabled = true;
  try {
    const r = await store.importRecipe(url);
    if (!r.ingredients?.length && !r.steps?.length) throw new Error('Auf der Seite wurden keine Zutaten gefunden.');
    openSheet(dishFormHtml(recipeToDish(r), true));
  } catch (e) {
    if (st) st.innerHTML = `<span style="color:var(--danger)">${esc(e.message || e)}</span>`;
    if (btn) btn.disabled = false;
  }
}

function printDishes(dishes, { book = false, title = '' } = {}) {
  if (!dishes.length) return toast('Keine Gerichte zum Exportieren');
  let html = '';
  if (book) {
    const date = new Date().toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' });
    html += `<div class="pr-cover"><h1>${esc(title || 'Unser Kochbuch')}</h1><p>${dishes.length} Rezepte · Stand ${esc(date)}</p></div>
      <div class="pr-toc"><h2>Inhalt</h2><ol>${dishes.map(d => `<li>${esc(d.name)}</li>`).join('')}</ol></div>`;
    html += dishes.map((d, i) => recipePrintHtml(d, i + 1)).join('').replace('<section class="pr-recipe">', '<section class="pr-recipe" style="break-before:page">');
  } else {
    html += dishes.map(d => recipePrintHtml(d)).join('');
  }
  let root = document.getElementById('print-root');
  if (!root) { root = document.createElement('div'); root.id = 'print-root'; document.body.appendChild(root); }
  root.innerHTML = html;
  const oldTitle = document.title;
  document.title = book ? (title || 'Kochbuch') : dishes.map(d => d.name).join(' + ');   // wird zum Dateinamen des PDFs
  // offenes Fenster während des Druckens schließen und danach wieder öffnen
  const reopen = dlg.open ? dlg.innerHTML : null; if (reopen) dlg.close();
  const done = () => { document.title = oldTitle; root.innerHTML = ''; window.removeEventListener('afterprint', done); if (reopen && !dlg.open) { dlg.innerHTML = reopen; dlg.showModal(); } };
  window.addEventListener('afterprint', done);
  setTimeout(() => window.print(), 50);
}

function stockMissing() {
  const out = [];

    for (const [a] of STOCK_AREAS) {

// ── Barcode-Scanner ──────────────────────────────────────
let _detector;
async function getDetector() {
  if (_detector) return _detector;
  const F = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'];
  if ('BarcodeDetector' in window) {
    try { const sup = await window.BarcodeDetector.getSupportedFormats(); const f = F.filter(x => sup.includes(x)); if (f.length) return (_detector = new window.BarcodeDetector({ formats: f })); } catch {}
  }
  // iPhone/Safari: Ersatz-Bibliothek (ZXing als WebAssembly)
  const { BarcodeDetector } = await import('https://fastly.jsdelivr.net/npm/barcode-detector@3/dist/es/ponyfill.min.js');
  return (_detector = new BarcodeDetector({ formats: F }));
}
function scanCode() {
  const d = $('#scandlg');
  d.innerHTML = `<div class="sheet"><div class="sheet-head"><button data-sc="cancel">Abbrechen</button><b>Barcode scannen</b><span style="width:60px"></span></div><div class="sheet-body">
    <div class="scanbox"><video playsinline muted autoplay></video><div class="frame"></div><div class="scanline"></div></div>
    <p class="hint" id="scan-msg">Kamera wird gestartet …</p>
    <label class="f">Oder Nummer eintippen</label><div class="addrow" style="margin-top:0"><input class="in" id="scan-manual" inputmode="numeric" placeholder="EAN, z. B. 4001234567890"><button class="btn" data-sc="ok">OK</button></div></div></div>`;
  d.showModal();
  return new Promise(async resolve => {
    let stream = null, stopped = false;
    const msg = t => { const m = d.querySelector('#scan-msg'); if (m) m.textContent = t; };
    const finish = code => { if (stopped) return; stopped = true; stream?.getTracks().forEach(t => t.stop()); d.close(); resolve(code); };
    d.onclick = e => { const b = e.target.closest('[data-sc]'); if (!b) return; if (b.dataset.sc === 'cancel') return finish(null); const v = $('#scan-manual').value.replace(/\D/g, ''); if (v) finish(v); };
    d.onkeydown = e => { if (e.key === 'Enter' && e.target.id === 'scan-manual') { e.preventDefault(); const v = e.target.value.replace(/\D/g, ''); if (v) finish(v); } };
    d.oncancel = e => { e.preventDefault(); finish(null); };
    try {
      if (!navigator.mediaDevices?.getUserMedia) throw new Error('Kamera wird von diesem Browser nicht unterstützt');
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false });
      if (stopped) { stream.getTracks().forEach(t => t.stop()); return; }
      const v = d.querySelector('video'); v.srcObject = stream; await v.play().catch(() => {});
      const det = await getDetector();
      msg('Barcode in den Rahmen halten');
      const loop = async () => {
        if (stopped) return;
        try { if (v.readyState >= 2) { const r = await det.detect(v); const hit = r.find(x => x.rawValue); if (hit) { navigator.vibrate?.(60); return finish(hit.rawValue); } } } catch {}
        setTimeout(loop, 200);
      };
      loop();
    } catch (e) { msg('Kamera nicht verfügbar (' + (e.message || e) + '). Nummer unten eintippen.'); }
  });
}
// Produktdaten von Open Food Facts (kostenlos, ohne Anmeldung)
async function offLookup(code) {
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 8000);
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_de,brands,quantity,product_quantity,product_quantity_unit,categories_tags`, { signal: ctl.signal });
    clearTimeout(t); const j = await r.json(); if (j.status !== 1 || !j.product) return null;
    const p = j.product; const cats = (p.categories_tags || []).join(' ');
    const grp = /beverage|water|juice|getrank/.test(cats) ? 'getraenke'
      : /pasta|rice|bread|cereal|potato|flour|crispbread|rusk/.test(cats) ? 'getreide'
      : /vegetable|legume|bean|lentil|pea|tomato|mushroom/.test(cats) ? 'gemuese'
      : /fruit|nut|compote/.test(cats) ? 'obst'
      : /dair|milk|cheese|yogurt/.test(cats) ? 'milch'
      : /meat|fish|seafood|tuna|egg|sausage/.test(cats) ? 'eiweiss'
      : /oil|fat|butter|lard/.test(cats) ? 'fett' : 'sonstiges';
    let size = Number(p.product_quantity) || null; const pu = String(p.product_quantity_unit || '').toLowerCase();
    if (size && pu === 'kg') size *= 1000; if (size && pu === 'l') size *= 1000; if (size && pu === 'cl') size *= 10;
    return { name: (p.product_name_de || p.product_name || '').trim(), brand: (p.brands || '').split(',')[0].trim(), quantity: p.quantity || '', size, grp };
  } catch { return null; }
}

  const area = v('area'), unit = v('unit');

    const moved = state.stock.items.filter(i => i.id !== id && i.barcodes.some(c => item.barcodes.includes(c))).map(i => ({ ...i, barcodes: i.barcodes.filter(c => !item.barcodes.includes(c)) }));

    state.stock.batches = [...state.stock.batches.filter(b => b.item_id !== id), ...rows];
    state.stockArea = area === 'lebensmittel' ? 'lebensmittel' : 'ausstattung'; ls.set('ep.stockArea', state.stockArea);

function download(name, text, type) {
  const blob = new Blob([text], { type }); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
async function doBackup() {
  const data = { app: 'essensplaner', version: 1, exported_at: new Date().toISOString(),
    dishes: await store.dishes(), plan: await store.plan('1900-01-01', '2999-12-31'), catalog: await store.catalog(),
    stock_items: await store.stockItems(), stock_batches: await store.stockBatches(), stock_settings: state.stockSet };
  download(`Essensplaner-Sicherung-${iso(new Date())}.json`, JSON.stringify(data, null, 1), 'application/json');
  toast(`Gesichert: ${data.dishes.length} Gerichte`);
}
async function doRestore(file) {
  let data; try { data = JSON.parse(await file.text()); } catch { return toast('Datei ist keine gültige Sicherung'); }
  if (data.app !== 'essensplaner' || !Array.isArray(data.dishes)) return toast('Datei ist keine Essensplaner-Sicherung');
  restorePending = data;
  openSheet(`<div class="sheet"><div class="sheet-head"><button data-act="close">Abbrechen</button><b>Sicherung laden</b><span></span></div><div class="sheet-body">
    <p>Sicherung vom <b>${esc(new Date(data.exported_at).toLocaleString('de-DE'))}</b> mit <b>${data.dishes.length} Gerichten</b>.</p>
    <button class="btn primary full" data-act="restore-merge">Ergänzen</button>
    <p class="hint">Fehlende Gerichte kommen dazu, vorhandene werden auf den Stand der Sicherung gebracht. Nichts wird gelöscht.</p>
    <button class="btn danger full" style="border:1px solid var(--danger)" data-act="restore-replace">Alles ersetzen</button>
    <p class="hint">Löscht alle aktuellen Gerichte und Wochenpläne und spielt die Sicherung ein.</p></div></div>`);
}
let restorePending = null;
async function applyRestore(replace) {
  const data = restorePending; if (!data) return;
  if (replace && !confirm('Wirklich alle aktuellen Gerichte und Wochenpläne löschen und durch die Sicherung ersetzen? Das lässt sich nicht rückgängig machen.')) return;
  restorePending = null;
  const dishes = data.dishes.map(normDish);
  const ids = new Set(dishes.map(d => d.id));
  const plan = (data.plan || []).filter(e => !e.dish_id || ids.has(e.dish_id) || state.dishes.some(d => d.id === e.dish_id));
  await guard(async () => {
    if (replace) await store.deleteAll();
    await store.saveDishes(dishes); await store.savePlan(plan); await store.saveCatalog(data.catalog || []);
    if (Array.isArray(data.stock_items)) { await store.saveStockItems(data.stock_items); await store.saveBatches(data.stock_batches || []); }
